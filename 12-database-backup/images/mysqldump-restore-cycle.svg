<svg viewBox="0 0 800 300" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <style>
    .mono { font-family: 'Courier New', monospace; font-size: 11px; }
    .heading { font-size: 14px; fill: #111827; font-weight: 700; }
    .label { font-size: 11px; fill: #6b7280; }
    .step { fill: #f0fdf4; stroke: #16a34a; stroke-width: 1.5; }
    .bad { fill: #fef2f2; stroke: #dc2626; stroke-width: 1.5; }
    .arrow { stroke: #9ca3af; stroke-width: 2; fill: none; marker-end: url(#arrow); }
  </style>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#9ca3af"/>
    </marker>
  </defs>
  <rect width="800" height="300" fill="#ffffff"/>
  <text x="30" y="26" class="heading">The restore-test cycle, actually run against backup_demo</text>

  <rect x="20" y="50" width="150" height="60" class="step"/>
  <text x="95" y="75" class="mono" text-anchor="middle" fill="#14532d">1. Create data</text>
  <text x="95" y="92" class="label" text-anchor="middle">customers + orders</text>

  <path d="M170,80 L205,80" class="arrow"/>

  <rect x="205" y="50" width="150" height="60" class="step"/>
  <text x="280" y="75" class="mono" text-anchor="middle" fill="#14532d">2. mysqldump</text>
  <text x="280" y="92" class="label" text-anchor="middle">backup_demo_full.sql</text>

  <path d="M355,80 L390,80" class="arrow"/>

  <rect x="390" y="50" width="150" height="60" class="bad"/>
  <text x="465" y="75" class="mono" text-anchor="middle" fill="#991b1b">3. DROP TABLE</text>
  <text x="465" y="92" class="label" text-anchor="middle" fill="#991b1b">orders - gone, for real</text>

  <path d="M540,80 L575,80" class="arrow"/>

  <rect x="575" y="50" width="200" height="60" class="step"/>
  <text x="675" y="75" class="mono" text-anchor="middle" fill="#14532d">4. Restore into scratch db</text>
  <text x="675" y="92" class="label" text-anchor="middle">backup_demo_restore_test</text>

  <path d="M675,110 L675,140" class="arrow"/>

  <rect x="505" y="140" width="270" height="60" class="step"/>
  <text x="640" y="165" class="mono" text-anchor="middle" fill="#14532d">5. Verify: SELECT COUNT(*)</text>
  <text x="640" y="182" class="label" text-anchor="middle">orders = 3 rows back, proven</text>

  <line x1="20" y1="225" x2="780" y2="225" stroke="#e5e7eb" stroke-width="1.5"/>
  <text x="30" y="249" class="heading" style="font-size:13px">Why a scratch database, not the original</text>
  <text x="30" y="270" class="label">Restoring into backup_demo_restore_test (not back into backup_demo) proves the backup actually works</text>
  <text x="30" y="286" class="label">without risking the original again - "the command didn't error" and "the data is correct" are different claims.</text>
</svg>
