<svg viewBox="0 0 760 320" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <style>
    .box { stroke: #1f2937; stroke-width: 1.5; }
    .title { font-size: 13px; fill: #ffffff; font-weight: 700; font-family: monospace; }
    .label { font-size: 11px; fill: #4b5563; }
    .line { stroke: #9ca3af; stroke-width: 1.5; fill: none; }
  </style>
  <rect width="760" height="320" fill="#ffffff"/>

  <!-- root -->
  <rect x="340" y="20" width="80" height="40" rx="6" class="box" fill="#111827"/>
  <text x="365" y="45" class="title">/</text>

  <!-- children row -->
  <g>
    <rect x="40"  y="120" width="90" height="40" rx="6" class="box" fill="#2563eb"/>
    <text x="55" y="145" class="title">/bin</text>
    <rect x="150" y="120" width="90" height="40" rx="6" class="box" fill="#2563eb"/>
    <text x="165" y="145" class="title">/etc</text>
    <rect x="260" y="120" width="90" height="40" rx="6" class="box" fill="#059669"/>
    <text x="270" y="145" class="title">/home</text>
    <rect x="370" y="120" width="90" height="40" rx="6" class="box" fill="#2563eb"/>
    <text x="385" y="145" class="title">/var</text>
    <rect x="480" y="120" width="90" height="40" rx="6" class="box" fill="#2563eb"/>
    <text x="493" y="145" class="title">/usr</text>
    <rect x="590" y="120" width="90" height="40" rx="6" class="box" fill="#d97706"/>
    <text x="602" y="145" class="title">/tmp</text>
  </g>

  <!-- connecting lines from root to children -->
  <path d="M380 60 L85 120" class="line"/>
  <path d="M380 60 L195 120" class="line"/>
  <path d="M380 60 L305 120" class="line"/>
  <path d="M380 60 L415 120" class="line"/>
  <path d="M380 60 L525 120" class="line"/>
  <path d="M380 60 L635 120" class="line"/>

  <!-- home's child: user folder -->
  <rect x="260" y="210" width="110" height="40" rx="6" class="box" fill="#10b981"/>
  <text x="270" y="235" class="title">/home/dev</text>
  <path d="M305 160 L305 210" class="line"/>

  <!-- labels under each -->
  <text x="30" y="178" class="label">programs</text>
  <text x="145" y="178" class="label">config files</text>
  <text x="258" y="178" class="label">user folders</text>
  <text x="372" y="178" class="label">logs, data</text>
  <text x="480" y="178" class="label">installed apps</text>
  <text x="588" y="178" class="label">temporary files</text>

  <text x="40" y="280" class="label" font-size="12">Everything starts at "/" (root) — not a drive letter, just one single tree for the whole system.</text>
  <text x="40" y="298" class="label" font-size="12">An absolute path always starts with "/" (e.g. /home/dev/project); a relative path doesn't (e.g. project/src).</text>
</svg>
