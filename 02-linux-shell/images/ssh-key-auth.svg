<svg viewBox="0 0 760 300" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <style>
    .box { stroke: #1f2937; stroke-width: 1.5; }
    .title { font-size: 14px; fill: #ffffff; font-weight: 700; }
    .sub { font-size: 11px; fill: #f3f4f6; }
    .label { font-size: 12px; fill: #374151; }
    .arrow { stroke: #2563eb; stroke-width: 2; fill: none; }
    .arrow2 { stroke: #059669; stroke-width: 2; fill: none; }
  </style>
  <rect width="760" height="300" fill="#ffffff"/>

  <!-- your machine -->
  <rect x="40" y="60" width="220" height="100" rx="10" fill="#eff6ff" stroke="#93c5fd"/>
  <text x="55" y="85" class="label" font-weight="700">Your machine</text>
  <rect x="55" y="100" width="190" height="45" rx="6" class="box" fill="#f87171"/>
  <text x="65" y="128" class="title" font-size="12">PRIVATE key — never leaves here</text>

  <!-- server -->
  <rect x="500" y="60" width="220" height="100" rx="10" fill="#ecfdf5" stroke="#6ee7b7"/>
  <text x="515" y="85" class="label" font-weight="700">The server</text>
  <rect x="515" y="100" width="190" height="45" rx="6" class="box" fill="#34d399"/>
  <text x="525" y="128" class="title" font-size="12">PUBLIC key — in ~/.ssh/authorized_keys</text>

  <!-- challenge arrow -->
  <path d="M500 95 L260 95" class="arrow" marker-end="url(#a1)"/>
  <text x="300" y="80" class="label" fill="#2563eb" font-size="11">1. Server sends a random "challenge"</text>

  <path d="M260 160 L500 160" class="arrow2" marker-end="url(#a2)"/>
  <text x="300" y="180" class="label" fill="#059669" font-size="11">2. Only the matching private key can sign it correctly</text>

  <text x="40" y="220" class="label" font-size="13">The server never sees your private key — it only checks whether the response proves you have it.</text>
  <text x="40" y="240" class="label" font-size="13">This is why you can safely copy your PUBLIC key to as many servers as you want, but never share the private one.</text>

  <defs>
    <marker id="a1" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#2563eb"/></marker>
    <marker id="a2" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#059669"/></marker>
  </defs>
</svg>
