<svg viewBox="0 0 800 330" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <style>
    .code { font-family: 'Courier New', monospace; font-size: 11px; }
    .heading { font-size: 14px; fill: #111827; font-weight: 700; }
    .t { font-size: 13px; font-weight: 700; }
    .label { font-size: 12px; }
    .note { font-size: 11px; fill: #6b7280; }
    .prom { fill: #fff7ed; stroke: #ea580c; stroke-width: 2; }
    .am { fill: #fef2f2; stroke: #dc2626; stroke-width: 2; }
    .out { fill: #ecfdf5; stroke: #059669; stroke-width: 1.5; }
    .state { fill: #f9fafb; stroke: #6b7280; stroke-width: 1.5; }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#374151"/></marker>
  </defs>
  <rect width="800" height="330" fill="#ffffff"/>
  <text x="15" y="26" class="heading">Prometheus decides WHEN something is wrong; Alertmanager decides WHO hears about it</text>

  <rect x="15" y="60" width="215" height="130" rx="8" class="prom"/>
  <text x="122" y="86" text-anchor="middle" class="t" fill="#9a3412">Prometheus</text>
  <text x="122" y="108" text-anchor="middle" class="label" fill="#1f2937">checks your alert rules</text>
  <text x="122" y="126" text-anchor="middle" class="label" fill="#1f2937">every evaluation_interval</text>
  <text x="122" y="152" text-anchor="middle" class="code" fill="#9a3412">expr: up == 0</text>
  <text x="122" y="170" text-anchor="middle" class="code" fill="#9a3412">for: 2m</text>

  <rect x="315" y="60" width="215" height="130" rx="8" class="am"/>
  <text x="422" y="86" text-anchor="middle" class="t" fill="#991b1b">Alertmanager  :9093</text>
  <text x="422" y="110" text-anchor="middle" class="label" fill="#1f2937">groups similar alerts</text>
  <text x="422" y="128" text-anchor="middle" class="label" fill="#1f2937">silences / inhibits</text>
  <text x="422" y="146" text-anchor="middle" class="label" fill="#1f2937">routes by label (severity)</text>
  <text x="422" y="170" text-anchor="middle" class="note">waits, then sends ONE message</text>

  <line x1="232" y1="125" x2="313" y2="125" stroke="#374151" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="240" y="116" class="note">firing alerts</text>

  <rect x="610" y="50" width="175" height="40" rx="6" class="out"/>
  <text x="622" y="75" class="t" fill="#065f46">Telegram / chat</text>
  <rect x="610" y="105" width="175" height="40" rx="6" class="out"/>
  <text x="622" y="130" class="t" fill="#065f46">Email</text>
  <rect x="610" y="160" width="175" height="40" rx="6" class="out"/>
  <text x="622" y="185" class="t" fill="#065f46">Webhook (any tool)</text>
  <line x1="532" y1="105" x2="608" y2="72" stroke="#374151" stroke-width="1.5" marker-end="url(#a)"/>
  <line x1="532" y1="125" x2="608" y2="125" stroke="#374151" stroke-width="1.5" marker-end="url(#a)"/>
  <line x1="532" y1="145" x2="608" y2="178" stroke="#374151" stroke-width="1.5" marker-end="url(#a)"/>

  <text x="15" y="232" class="heading">The life of one alert inside Prometheus</text>
  <rect x="15" y="246" width="170" height="56" rx="6" class="state"/>
  <text x="27" y="268" class="t" fill="#374151">inactive</text>
  <text x="27" y="288" class="label" fill="#1f2937">condition is false</text>
  <rect x="300" y="246" width="200" height="56" rx="6" class="state"/>
  <text x="312" y="268" class="t" fill="#b45309">pending</text>
  <text x="312" y="288" class="label" fill="#1f2937">true, but not for long enough</text>
  <rect x="615" y="246" width="170" height="56" rx="6" class="state"/>
  <text x="627" y="268" class="t" fill="#b91c1c">firing</text>
  <text x="627" y="288" class="label" fill="#1f2937">sent to Alertmanager</text>
  <line x1="187" y1="274" x2="298" y2="274" stroke="#374151" stroke-width="1.5" marker-end="url(#a)"/>
  <line x1="502" y1="274" x2="613" y2="274" stroke="#374151" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="195" y="264" class="note">condition true</text>
  <text x="508" y="264" class="note">still true after "for"</text>
</svg>
