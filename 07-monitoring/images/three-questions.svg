<svg viewBox="0 0 800 300" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <style>
    .code { font-family: 'Courier New', monospace; font-size: 11px; }
    .heading { font-size: 14px; fill: #111827; font-weight: 700; }
    .t { font-size: 13px; font-weight: 700; }
    .q { font-size: 13px; font-weight: 700; fill: #111827; }
    .label { font-size: 12px; fill: #1f2937; }
    .note { font-size: 11px; fill: #6b7280; }
    .c1 { fill: #eff6ff; stroke: #2563eb; stroke-width: 1.5; }
    .c2 { fill: #ecfdf5; stroke: #059669; stroke-width: 1.5; }
    .c3 { fill: #fef2f2; stroke: #dc2626; stroke-width: 1.5; }
  </style>
  <rect width="800" height="300" fill="#ffffff"/>
  <text x="15" y="26" class="heading">Three different questions, three different tools</text>

  <rect x="15" y="44" width="250" height="236" rx="8" class="c1"/>
  <text x="28" y="70" class="q">"What happened on my</text>
  <text x="28" y="88" class="q">servers?"</text>
  <text x="28" y="116" class="t" fill="#1e3a8a">Central logging</text>
  <text x="28" y="136" class="label">Loki (+ Alloy agent)</text>
  <text x="28" y="164" class="label">All log lines from all servers,</text>
  <text x="28" y="182" class="label">searched in one place (Grafana)</text>
  <text x="28" y="216" class="code" fill="#1e3a8a">{job="laravel"} |= "ERROR"</text>
  <text x="28" y="262" class="note">Looks at the INSIDE, after the fact</text>

  <rect x="275" y="44" width="250" height="236" rx="8" class="c2"/>
  <text x="288" y="70" class="q">"Can a visitor reach my</text>
  <text x="288" y="88" class="q">site right now?"</text>
  <text x="288" y="116" class="t" fill="#065f46">Uptime check</text>
  <text x="288" y="136" class="label">Blackbox exporter (or Uptime Kuma)</text>
  <text x="288" y="164" class="label">Visits your URL like a visitor,</text>
  <text x="288" y="182" class="label">from OUTSIDE, every minute</text>
  <text x="288" y="216" class="code" fill="#065f46">probe_success == 0</text>
  <text x="288" y="262" class="note">Looks from the OUTSIDE, right now</text>

  <rect x="535" y="44" width="250" height="236" rx="8" class="c3"/>
  <text x="548" y="70" class="q">"Which exception did my</text>
  <text x="548" y="88" class="q">users just hit?"</text>
  <text x="548" y="116" class="t" fill="#991b1b">Error tracking</text>
  <text x="548" y="136" class="label">Sentry (or GlitchTip)</text>
  <text x="548" y="164" class="label">Each exception with stack trace,</text>
  <text x="548" y="182" class="label">grouped, counted, with context</text>
  <text x="548" y="216" class="code" fill="#991b1b">NEW issue: TypeError ...</text>
  <text x="548" y="262" class="note">Looks inside the CODE, per error</text>
</svg>
