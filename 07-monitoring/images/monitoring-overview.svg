<svg viewBox="0 0 800 330" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <style>
    .mono { font-family: 'Courier New', monospace; font-size: 12px; }
    .heading { font-size: 14px; fill: #111827; font-weight: 700; }
    .label { font-size: 11px; fill: #6b7280; }
    .app { fill: #ecfdf5; stroke: #059669; stroke-width: 1.5; }
    .met { fill: #eff6ff; stroke: #2563eb; stroke-width: 1.5; }
    .log { fill: #fff7ed; stroke: #ea580c; stroke-width: 1.5; }
    .alt { fill: #fef2f2; stroke: #dc2626; stroke-width: 1.5; }
    .human { fill: #fefce8; stroke: #ca8a04; stroke-width: 1.5; }
    .arrow { stroke: #374151; stroke-width: 1.5; fill: none; marker-end: url(#arrow); }
    .dash { stroke: #6b7280; stroke-width: 1.3; fill: none; stroke-dasharray: 5 3; marker-end: url(#arrow); }
  </style>
  <defs>
    <marker id="arrow" markerWidth="7" markerHeight="7" refX="5" refY="3.5" orient="auto">
      <path d="M0,0 L7,3.5 L0,7 z" fill="#374151"/>
    </marker>
  </defs>
  <rect width="800" height="330" fill="#ffffff"/>
  <text x="30" y="26" class="heading">Three jobs that work together</text>

  <rect x="20" y="110" width="150" height="100" class="app"/>
  <text x="32" y="136" class="mono" fill="#065f46">Your app + server</text>
  <text x="32" y="156" class="label">produces numbers</text>
  <text x="32" y="172" class="label">and event records</text>

  <rect x="260" y="50" width="190" height="80" class="met"/>
  <text x="272" y="75" class="mono" fill="#1e3a8a">METRICS</text>
  <text x="272" y="95" class="label">numbers over time</text>
  <text x="272" y="111" class="label">"error rate jumped at 14:03"</text>

  <rect x="260" y="190" width="190" height="80" class="log"/>
  <text x="272" y="215" class="mono" fill="#9a3412">LOGS</text>
  <text x="272" y="235" class="label">detailed event records</text>
  <text x="272" y="251" class="label">"gateway timeout, order 4812"</text>

  <rect x="540" y="50" width="140" height="80" class="alt"/>
  <text x="552" y="75" class="mono" fill="#7f1d1d">ALERT</text>
  <text x="552" y="95" class="label">"errors above 2%</text>
  <text x="552" y="111" class="label"> for 5 minutes"</text>

  <rect x="700" y="110" width="90" height="100" class="human"/>
  <text x="710" y="150" class="mono" fill="#713f12">You</text>
  <text x="710" y="168" class="label">phone / chat</text>

  <path d="M170 140 L258 100" class="arrow"/>
  <path d="M170 180 L258 225" class="arrow"/>
  <path d="M450 90 L538 90" class="arrow"/>
  <path d="M680 100 L720 118" class="arrow"/>
  <path d="M700 190 L452 235" class="dash"/>
  <text x="30" y="305" class="label">1. Metrics show THAT something is wrong.   2. The alert makes sure you HEAR about it.   3. Logs explain WHY (dashed: you go and read them).</text>
</svg>
