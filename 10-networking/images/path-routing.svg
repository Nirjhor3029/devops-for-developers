<svg viewBox="0 0 800 340" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <style>
    .mono { font-family: 'Courier New', monospace; font-size: 11px; }
    .heading { font-size: 14px; fill: #111827; font-weight: 700; }
    .label { font-size: 11px; fill: #6b7280; }
    .you { fill: #fefce8; stroke: #ca8a04; stroke-width: 1.5; }
    .web { fill: #eff6ff; stroke: #2563eb; stroke-width: 1.5; }
    .site { fill: #ecfdf5; stroke: #059669; stroke-width: 1.3; }
    .arrow { stroke: #374151; stroke-width: 1.5; fill: none; marker-end: url(#arrow); }
  </style>
  <defs>
    <marker id="arrow" markerWidth="7" markerHeight="7" refX="5" refY="3.5" orient="auto">
      <path d="M0,0 L7,3.5 L0,7 z" fill="#374151"/>
    </marker>
  </defs>
  <rect width="800" height="340" fill="#ffffff"/>
  <text x="30" y="26" class="heading">One domain, one reverse proxy, three backends by path</text>

  <rect x="20" y="130" width="160" height="70" class="you"/>
  <text x="34" y="156" class="mono" fill="#713f12">Browser</text>
  <text x="34" y="176" class="label">myshop.com/api/orders</text>

  <rect x="300" y="40" width="200" height="260" class="web"/>
  <text x="312" y="64" class="mono" fill="#1e3a8a">Nginx / Caddy</text>
  <text x="312" y="80" class="label">one domain, port 443</text>

  <rect x="316" y="100" width="168" height="50" class="site"/>
  <text x="324" y="118" class="mono" fill="#065f46">/api/* ←</text>
  <text x="324" y="134" class="label">strips prefix</text>

  <rect x="316" y="160" width="168" height="50" class="site"/>
  <text x="324" y="178" class="mono" fill="#065f46">/app/*</text>
  <text x="324" y="194" class="label">keeps full path</text>

  <rect x="316" y="220" width="168" height="50" class="site"/>
  <text x="324" y="238" class="mono" fill="#065f46">/ (everything else)</text>
  <text x="324" y="254" class="label">static files</text>

  <rect x="610" y="90" width="170" height="40" class="web"/>
  <text x="622" y="114" class="mono" fill="#1e3a8a">127.0.0.1:8080</text>

  <rect x="610" y="150" width="170" height="40" class="web"/>
  <text x="622" y="174" class="mono" fill="#1e3a8a">127.0.0.1:9090</text>

  <rect x="610" y="210" width="170" height="40" class="web"/>
  <text x="622" y="234" class="mono" fill="#1e3a8a">/var/www/.../public</text>

  <path d="M182 160 L298 125" class="arrow"/>
  <path d="M502 125 L608 110" class="arrow"/>
  <path d="M502 185 L608 170" class="arrow"/>
  <path d="M502 245 L608 230" class="arrow"/>

  <text x="30" y="300" class="label">The request's path decides which backend answers — only one block runs per request, checked in order.</text>
  <text x="30" y="318" class="label">/api/orders arrives at 8080 as just /orders (prefix stripped); /app/* arrives at 9090 unchanged.</text>
</svg>
