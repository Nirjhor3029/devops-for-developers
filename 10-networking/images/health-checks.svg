<svg viewBox="0 0 800 340" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <style>
    .mono { font-family: 'Courier New', monospace; font-size: 11px; }
    .heading { font-size: 14px; fill: #111827; font-weight: 700; }
    .label { font-size: 11px; fill: #6b7280; }
    .you { fill: #fefce8; stroke: #ca8a04; stroke-width: 1.5; }
    .web { fill: #eff6ff; stroke: #2563eb; stroke-width: 1.5; }
    .ok { fill: #ecfdf5; stroke: #059669; stroke-width: 1.5; }
    .bad { fill: #fef2f2; stroke: #dc2626; stroke-width: 1.5; }
    .arrow { stroke: #374151; stroke-width: 1.5; fill: none; marker-end: url(#arrow); }
    .ack { stroke: #059669; stroke-width: 1.5; fill: none; marker-end: url(#arrowg); }
    .deadarrow { stroke: #dc2626; stroke-width: 1.5; fill: none; marker-end: url(#arrowr); stroke-dasharray: 4 3; }
  </style>
  <defs>
    <marker id="arrow" markerWidth="7" markerHeight="7" refX="5" refY="3.5" orient="auto">
      <path d="M0,0 L7,3.5 L0,7 z" fill="#374151"/>
    </marker>
    <marker id="arrowg" markerWidth="7" markerHeight="7" refX="5" refY="3.5" orient="auto">
      <path d="M0,0 L7,3.5 L0,7 z" fill="#059669"/>
    </marker>
    <marker id="arrowr" markerWidth="7" markerHeight="7" refX="5" refY="3.5" orient="auto">
      <path d="M0,0 L7,3.5 L0,7 z" fill="#dc2626"/>
    </marker>
  </defs>
  <rect width="800" height="340" fill="#ffffff"/>
  <text x="30" y="26" class="heading">Active health check: the load balancer finds the dead backend first</text>

  <rect x="20" y="130" width="150" height="60" class="you"/>
  <text x="34" y="156" class="mono" fill="#713f12">Client</text>
  <text x="34" y="174" class="label">curl (every request)</text>

  <rect x="290" y="110" width="200" height="100" class="web"/>
  <text x="304" y="134" class="mono" fill="#1e3a8a">Caddy reverse_proxy</text>
  <text x="304" y="150" class="label">health_uri /, every 2s</text>
  <text x="304" y="166" class="label">lb_policy round_robin</text>

  <rect x="610" y="60" width="170" height="50" class="bad"/>
  <text x="622" y="84" class="mono" fill="#991b1b">backend-1 :18081</text>
  <text x="622" y="100" class="label">killed</text>

  <rect x="610" y="190" width="170" height="50" class="ok"/>
  <text x="622" y="214" class="mono" fill="#065f46">backend-2 :18082</text>
  <text x="622" y="230" class="label">healthy</text>

  <path d="M172 150 L288 150" class="arrow"/>
  <path d="M492 150 L608 215" class="ack"/>
  <path d="M492 145 L608 90" class="deadarrow"/>

  <text x="300" y="250" class="label">1: Caddy's own background probe hits :18081 on a fixed schedule — not triggered by any client request.</text>
  <text x="300" y="268" class="label">2: probe fails (connection refused) → backend-1 is marked unhealthy and removed from rotation.</text>
  <text x="300" y="286" class="label">3: every real client request now goes only to backend-2 — no user ever reaches the dead backend.</text>
  <text x="30" y="316" class="label">Open-source Nginx has no step 1 — it only learns a backend is down from a real request failing (passive).</text>
</svg>
