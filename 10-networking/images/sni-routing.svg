<svg viewBox="0 0 800 320" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <style>
    .mono { font-family: 'Courier New', monospace; font-size: 11px; }
    .heading { font-size: 14px; fill: #111827; font-weight: 700; }
    .label { font-size: 11px; fill: #6b7280; }
    .you { fill: #fefce8; stroke: #ca8a04; stroke-width: 1.5; }
    .web { fill: #eff6ff; stroke: #2563eb; stroke-width: 1.5; }
    .site { fill: #ecfdf5; stroke: #059669; stroke-width: 1.3; }
    .arrow { stroke: #374151; stroke-width: 1.5; fill: none; marker-end: url(#arrow); }
    .sec { stroke: #059669; stroke-width: 2.5; fill: none; marker-end: url(#arrowg); }
  </style>
  <defs>
    <marker id="arrow" markerWidth="7" markerHeight="7" refX="5" refY="3.5" orient="auto">
      <path d="M0,0 L7,3.5 L0,7 z" fill="#374151"/>
    </marker>
    <marker id="arrowg" markerWidth="7" markerHeight="7" refX="5" refY="3.5" orient="auto">
      <path d="M0,0 L7,3.5 L0,7 z" fill="#059669"/>
    </marker>
  </defs>
  <rect width="800" height="320" fill="#ffffff"/>
  <text x="30" y="26" class="heading">SNI: one IP, one port 443, one certificate picked per request</text>

  <rect x="20" y="110" width="160" height="80" class="you"/>
  <text x="32" y="136" class="mono" fill="#713f12">Browser</text>
  <text x="32" y="156" class="label">wants</text>
  <text x="32" y="172" class="label">pay.bazardev.com</text>

  <rect x="300" y="60" width="200" height="190" class="web"/>
  <text x="312" y="84" class="mono" fill="#1e3a8a">Caddy / Nginx</text>
  <text x="312" y="100" class="label">one IP : 443</text>

  <rect x="316" y="114" width="168" height="26" class="site"/>
  <text x="324" y="131" class="mono" fill="#065f46">learn.bazardev.com</text>
  <rect x="316" y="146" width="168" height="26" class="site" stroke-width="2.5"/>
  <text x="324" y="163" class="mono" fill="#065f46">pay.bazardev.com ←</text>
  <rect x="316" y="178" width="168" height="26" class="site"/>
  <text x="324" y="195" class="mono" fill="#065f46">shop.bazardev.com</text>
  <text x="312" y="222" class="label">each site: its own</text>
  <text x="312" y="236" class="label">certificate on file</text>

  <rect x="620" y="110" width="160" height="80" class="you"/>
  <text x="632" y="136" class="mono" fill="#713f12">Browser</text>
  <text x="632" y="156" class="label">gets back the</text>
  <text x="632" y="172" class="label">pay.* certificate</text>

  <path d="M182 140 L298 140" class="sec"/>
  <text x="190" y="130" class="label">1: Client Hello + SNI = "pay.bazardev.com" (plaintext)</text>

  <path d="M502 160 L618 160" class="sec"/>
  <text x="510" y="150" class="label">2: matching cert sent back</text>

  <text x="30" y="285" class="label">The hostname in step 1 travels before any encryption starts — it has to, so the server knows which certificate (and which site) to use. TLS then encrypts everything after this handshake.</text>
</svg>
