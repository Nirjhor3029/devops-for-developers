<svg viewBox="0 0 800 360" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <style>
    .mono { font-family: 'Courier New', monospace; font-size: 11px; }
    .heading { font-size: 14px; fill: #111827; font-weight: 700; }
    .label { font-size: 11px; fill: #6b7280; }
    .you { fill: #fefce8; stroke: #ca8a04; stroke-width: 1.5; }
    .web { fill: #eff6ff; stroke: #2563eb; stroke-width: 1.5; }
    .arrow { stroke: #374151; stroke-width: 1.5; fill: none; marker-end: url(#arrow); }
    .ack { stroke: #059669; stroke-width: 1.5; fill: none; marker-end: url(#arrowg); }
    .num { font-size: 11px; fill: #ffffff; font-weight: 700; }
    .dot { fill: #374151; }
    .dotg { fill: #059669; }
  </style>
  <defs>
    <marker id="arrow" markerWidth="7" markerHeight="7" refX="5" refY="3.5" orient="auto">
      <path d="M0,0 L7,3.5 L0,7 z" fill="#374151"/>
    </marker>
    <marker id="arrowg" markerWidth="7" markerHeight="7" refX="5" refY="3.5" orient="auto">
      <path d="M0,0 L7,3.5 L0,7 z" fill="#059669"/>
    </marker>
  </defs>
  <rect width="800" height="360" fill="#ffffff"/>
  <text x="30" y="26" class="heading">TLS 1.3: a full handshake in one round trip</text>

  <rect x="20" y="90" width="170" height="70" class="you"/>
  <text x="34" y="116" class="mono" fill="#713f12">Client</text>
  <text x="34" y="136" class="label">has: supported</text>
  <text x="34" y="150" class="label">versions + key_share</text>

  <rect x="610" y="90" width="170" height="70" class="web"/>
  <text x="624" y="116" class="mono" fill="#1e3a8a">Server</text>
  <text x="624" y="136" class="label">has: certificate +</text>
  <text x="624" y="150" class="label">private key</text>

  <path d="M192 150 L608 150" class="arrow"/>
  <path d="M608 210 L192 210" class="ack"/>
  <path d="M192 250 L608 250" class="arrow"/>

  <circle cx="400" cy="150" r="9" class="dot"/><text x="396" y="154" class="num">1</text>
  <circle cx="400" cy="210" r="9" class="dotg"/><text x="396" y="214" class="num">2</text>
  <circle cx="400" cy="250" r="9" class="dot"/><text x="396" y="254" class="num">3</text>

  <text x="220" y="140" class="mono" fill="#374151">ClientHello: SNI, key_share</text>
  <text x="220" y="178" class="mono" fill="#065f46">ServerHello: key_share</text>
  <text x="220" y="194" class="mono" fill="#065f46">— both sides derive the same secret; everything below is encrypted —</text>
  <text x="220" y="203" class="mono" fill="#065f46">EncryptedExtensions, Certificate, CertificateVerify, Finished</text>
  <text x="220" y="242" class="mono" fill="#374151">Finished</text>

  <rect x="192" y="262" width="416" height="22" fill="#ecfdf5" stroke="#059669" stroke-width="1"/>
  <text x="200" y="277" class="mono" fill="#065f46">Application data (the HTTP request) starts right here</text>

  <text x="30" y="310" class="label">1: the client guesses the key-exchange method and sends its half immediately — no extra round trip to ask.</text>
  <text x="30" y="328" class="label">2: the server replies with its half, its certificate, and proof it holds the matching private key — one flight, already encrypted from here.</text>
  <text x="30" y="346" class="label">3: client confirms the handshake transcript matches. TLS 1.2 needed a second full round trip to get here.</text>
</svg>
