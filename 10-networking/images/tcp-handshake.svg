<svg viewBox="0 0 800 360" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <style>
    .mono { font-family: 'Courier New', monospace; font-size: 12px; }
    .heading { font-size: 14px; fill: #111827; font-weight: 700; }
    .label { font-size: 11px; fill: #6b7280; }
    .you { fill: #fefce8; stroke: #ca8a04; stroke-width: 1.5; }
    .web { fill: #eff6ff; stroke: #2563eb; stroke-width: 1.5; }
    .arrow { stroke: #374151; stroke-width: 1.5; fill: none; marker-end: url(#arrow); }
    .ack { stroke: #059669; stroke-width: 1.5; fill: none; marker-end: url(#arrowg); }
    .num { font-size: 11px; fill: #ffffff; font-weight: 700; }
    .dot { fill: #374151; }
    .dotg { fill: #059669; }
  </style>
  <defs>
    <marker id="arrow" markerWidth="7" markerHeight="7" refX="5" refY="3.5" orient="auto">
      <path d="M0,0 L7,3.5 L0,7 z" fill="#374151"/>
    </marker>
    <marker id="arrowg" markerWidth="7" markerHeight="7" refX="5" refY="3.5" orient="auto">
      <path d="M0,0 L7,3.5 L0,7 z" fill="#059669"/>
    </marker>
  </defs>
  <rect width="800" height="360" fill="#ffffff"/>
  <text x="30" y="26" class="heading">The TCP three-way handshake, before any data moves</text>

  <rect x="20" y="90" width="170" height="80" class="you"/>
  <text x="34" y="116" class="mono" fill="#713f12">Client</text>
  <text x="34" y="136" class="label">your browser</text>
  <text x="34" y="152" class="label">203.0.113.50:51442</text>

  <rect x="610" y="90" width="170" height="80" class="web"/>
  <text x="624" y="116" class="mono" fill="#1e3a8a">Server</text>
  <text x="624" y="136" class="label">your VPS</text>
  <text x="624" y="152" class="label">198.51.100.10:443</text>

  <path d="M192 150 L608 150" class="arrow"/>
  <path d="M608 185 L192 185" class="ack"/>
  <path d="M192 220 L608 220" class="arrow"/>

  <circle cx="400" cy="150" r="9" class="dot"/><text x="396" y="154" class="num">1</text>
  <circle cx="400" cy="185" r="9" class="dotg"/><text x="396" y="189" class="num">2</text>
  <circle cx="400" cy="220" r="9" class="dot"/><text x="396" y="224" class="num">3</text>

  <text x="220" y="140" class="mono" fill="#374151">SYN (seq=x)</text>
  <text x="220" y="178" class="mono" fill="#065f46">SYN-ACK (seq=y, ack=x+1)</text>
  <text x="220" y="212" class="mono" fill="#374151">ACK (ack=y+1)</text>

  <text x="30" y="270" class="label">1: client picks a free local port and says "let's talk" with a starting sequence number.</text>
  <text x="30" y="288" class="label">2: server agrees, acknowledges the client's number, and sends its own.</text>
  <text x="30" y="306" class="label">3: client acknowledges the server's number. Only now does real data (the HTTP request) start.</text>
  <text x="30" y="332" class="label">A socket is this exact 4-tuple: (client IP, client port, server IP, server port) + protocol (TCP). That is how the server tells apart thousands of connections on the same port 443.</text>
</svg>
