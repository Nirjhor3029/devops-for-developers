<svg viewBox="0 0 800 300" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <style>
    .mono { font-family: 'Courier New', monospace; font-size: 12px; }
    .step { fill: #eff6ff; stroke: #2563eb; stroke-width: 1; }
    .ci { fill: #ecfdf5; stroke: #059669; stroke-width: 1; }
    .cd { fill: #fef3c7; stroke: #b45309; stroke-width: 1; }
    .heading { font-size: 14px; fill: #111827; font-weight: 700; }
    .label { font-size: 12px; fill: #6b7280; }
    .bracket { stroke: #374151; stroke-width: 2; fill: none; }
    .arrow { stroke: #374151; stroke-width: 2; fill: none; marker-end: url(#arrow); }
  </style>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#374151"/>
    </marker>
  </defs>
  <rect width="800" height="300" fill="#ffffff"/>

  <text x="30" y="26" class="heading">One push, start to finish — no human runs any of these steps by hand</text>

  <rect x="20" y="50" width="110" height="50" class="step"/>
  <text x="30" y="72" class="mono" fill="#1e3a8a">git push</text>
  <text x="30" y="88" class="mono" fill="#1e3a8a">/ open PR</text>
  <path d="M135 75 L170 75" class="arrow"/>

  <rect x="175" y="50" width="100" height="50" class="ci"/>
  <text x="183" y="72" class="mono" fill="#065f46">Build</text>
  <path d="M280 75 L315 75" class="arrow"/>

  <rect x="320" y="50" width="100" height="50" class="ci"/>
  <text x="328" y="72" class="mono" fill="#065f46">Test</text>
  <path d="M425 75 L460 75" class="arrow"/>

  <rect x="465" y="50" width="130" height="50" class="cd"/>
  <text x="473" y="72" class="mono" fill="#92400e">Package</text>
  <text x="473" y="88" class="mono" fill="#92400e">(Docker image)</text>
  <path d="M600 75 L635 75" class="arrow"/>

  <rect x="640" y="50" width="140" height="50" class="cd"/>
  <text x="648" y="72" class="mono" fill="#92400e">Deploy to</text>
  <text x="648" y="88" class="mono" fill="#92400e">production</text>

  <path d="M175 115 L425 115" class="bracket"/>
  <path d="M175 115 L175 125" class="bracket"/>
  <path d="M425 115 L425 125" class="bracket"/>
  <text x="250" y="140" class="heading" fill="#059669">CI — Continuous Integration</text>
  <text x="195" y="158" class="label">catch problems the moment code is pushed, every single time</text>

  <path d="M465 170 L780 170" class="bracket"/>
  <path d="M465 170 L465 180" class="bracket"/>
  <path d="M780 170 L780 180" class="bracket"/>
  <text x="520" y="195" class="heading" fill="#b45309">CD — Continuous Delivery / Deployment</text>
  <text x="480" y="213" class="label">get a tested change into users' hands, automatically or with one click</text>

  <text x="30" y="260" class="label">Delivery: pipeline prepares a release, a human clicks "deploy".  Deployment: the pipeline deploys it too — nobody clicks anything.</text>
  <text x="30" y="280" class="label">If any step fails (a test, a build), the pipeline stops right there — a broken change never reaches the next step.</text>
</svg>
