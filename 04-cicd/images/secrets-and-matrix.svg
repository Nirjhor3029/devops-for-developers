<svg viewBox="0 0 800 380" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <style>
    .mono { font-family: 'Courier New', monospace; font-size: 12px; }
    .secret { fill: #fee2e2; stroke: #dc2626; stroke-width: 1; }
    .step { fill: #eff6ff; stroke: #2563eb; stroke-width: 1; }
    .job { fill: #ecfdf5; stroke: #059669; stroke-width: 1; }
    .heading { font-size: 14px; fill: #111827; font-weight: 700; }
    .label { font-size: 11px; fill: #6b7280; }
    .arrow { stroke: #374151; stroke-width: 1.5; fill: none; marker-end: url(#arrow); }
  </style>
  <defs>
    <marker id="arrow" markerWidth="7" markerHeight="7" refX="5" refY="3.5" orient="auto">
      <path d="M0,0 L7,3.5 L0,7 z" fill="#374151"/>
    </marker>
  </defs>
  <rect width="800" height="380" fill="#ffffff"/>

  <text x="30" y="26" class="heading">Secrets flow in encrypted, GitHub masks them from every log</text>
  <rect x="20" y="40" width="200" height="50" class="secret"/>
  <text x="30" y="60" class="mono" fill="#991b1b">Settings → Secrets</text>
  <text x="30" y="76" class="mono" fill="#991b1b">DB_PASSWORD = ***</text>
  <path d="M225 65 L280 65" class="arrow"/>
  <rect x="285" y="40" width="230" height="50" class="step"/>
  <text x="293" y="60" class="mono" fill="#1e3a8a">env:</text>
  <text x="293" y="76" class="mono" fill="#1e3a8a">  DB_PASSWORD: ${{secrets.DB_PASSWORD}}</text>
  <path d="M520 65 L575 65" class="arrow"/>
  <rect x="580" y="40" width="190" height="50" class="job"/>
  <text x="588" y="60" class="mono" fill="#065f46">log output:</text>
  <text x="588" y="76" class="mono" fill="#065f46">DB_PASSWORD=***</text>

  <text x="30" y="135" class="heading">A matrix expands ONE job definition into many parallel jobs</text>
  <rect x="20" y="150" width="260" height="70" class="step"/>
  <text x="30" y="172" class="mono" fill="#1e3a8a">strategy:</text>
  <text x="30" y="190" class="mono" fill="#1e3a8a">  matrix:</text>
  <text x="30" y="208" class="mono" fill="#1e3a8a">    php: [8.2, 8.3]</text>

  <path d="M285 165 C 330 165, 330 165, 380 165" class="arrow"/>
  <path d="M285 185 C 330 200, 330 230, 380 240" class="arrow"/>

  <rect x="385" y="150" width="190" height="34" class="job"/>
  <text x="393" y="171" class="mono" fill="#065f46">job (php: 8.2)</text>

  <rect x="385" y="225" width="190" height="34" class="job"/>
  <text x="393" y="246" class="mono" fill="#065f46">job (php: 8.3)</text>

  <text x="600" y="171" class="label">runs in parallel —</text>
  <text x="600" y="186" class="label">same steps, different</text>
  <text x="600" y="201" class="label">php version each time</text>

  <text x="30" y="290" class="label">A matrix with [php: 8.2, 8.3] × [os: ubuntu, windows] creates FOUR jobs — one per combination.</text>
  <text x="30" y="310" class="label">fail-fast: false keeps every combination running even if one fails, instead of cancelling the rest.</text>
  <text x="30" y="340" class="label" fill="#991b1b">Never put a secret directly in a workflow file — always reference it via ${{ secrets.NAME }}.</text>
</svg>
