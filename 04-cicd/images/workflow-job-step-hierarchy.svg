<svg viewBox="0 0 800 340" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <style>
    .mono { font-family: 'Courier New', monospace; font-size: 12px; }
    .workflow { fill: #f9fafb; stroke: #374151; stroke-width: 1.5; }
    .job { fill: #eff6ff; stroke: #2563eb; stroke-width: 1; }
    .step { fill: #ecfdf5; stroke: #059669; stroke-width: 1; }
    .heading { font-size: 14px; fill: #111827; font-weight: 700; }
    .label { font-size: 11px; fill: #6b7280; }
    .arrow { stroke: #374151; stroke-width: 1.5; fill: none; marker-end: url(#arrow); }
  </style>
  <defs>
    <marker id="arrow" markerWidth="7" markerHeight="7" refX="5" refY="3.5" orient="auto">
      <path d="M0,0 L7,3.5 L0,7 z" fill="#374151"/>
    </marker>
  </defs>
  <rect width="800" height="340" fill="#ffffff"/>

  <text x="30" y="26" class="heading">One workflow file → one or more jobs (parallel by default) → steps (sequential)</text>

  <rect x="20" y="40" width="760" height="280" class="workflow"/>
  <text x="32" y="60" class="mono" fill="#111827">.github/workflows/ci.yml</text>

  <!-- job 1 -->
  <rect x="40" y="75" width="340" height="220" class="job"/>
  <text x="52" y="95" class="mono" fill="#1e3a8a">job: test  (runs-on: ubuntu-latest)</text>

  <rect x="55" y="105" width="310" height="34" class="step"/>
  <text x="63" y="126" class="mono" fill="#065f46">uses: actions/checkout@v4</text>

  <rect x="55" y="145" width="310" height="34" class="step"/>
  <text x="63" y="166" class="mono" fill="#065f46">uses: shivammathur/setup-php@v2</text>

  <rect x="55" y="185" width="310" height="34" class="step"/>
  <text x="63" y="206" class="mono" fill="#065f46">run: composer install</text>

  <rect x="55" y="225" width="310" height="34" class="step"/>
  <text x="63" y="246" class="mono" fill="#065f46">run: php artisan test</text>

  <path d="M210 139 L210 145" class="arrow"/>
  <path d="M210 179 L210 185" class="arrow"/>
  <path d="M210 219 L210 225" class="arrow"/>
  <text x="55" y="275" class="label">steps run top to bottom, in order, on the same machine</text>

  <!-- job 2 -->
  <rect x="420" y="75" width="340" height="120" class="job"/>
  <text x="432" y="95" class="mono" fill="#1e3a8a">job: lint  (runs-on: ubuntu-latest)</text>

  <rect x="435" y="105" width="310" height="34" class="step"/>
  <text x="443" y="126" class="mono" fill="#065f46">uses: actions/checkout@v4</text>

  <rect x="435" y="145" width="310" height="34" class="step"/>
  <text x="443" y="166" class="mono" fill="#065f46">run: ./vendor/bin/pint --test</text>

  <text x="420" y="215" class="label">a separate job = a separate, fresh virtual machine</text>
  <text x="420" y="233" class="label">"test" and "lint" start at the same time, independently</text>
</svg>
