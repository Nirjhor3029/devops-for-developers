<svg viewBox="0 0 800 320" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <style>
    .mono { font-family: 'Courier New', monospace; font-size: 12px; }
    .heading { font-size: 14px; fill: #111827; font-weight: 700; }
    .label { font-size: 11px; fill: #6b7280; }
    .who { fill: #fefce8; stroke: #ca8a04; stroke-width: 1.5; }
    .pol { fill: #eff6ff; stroke: #2563eb; stroke-width: 1.5; }
    .res { fill: #ecfdf5; stroke: #059669; stroke-width: 1.5; }
    .deny { fill: #fef2f2; stroke: #dc2626; stroke-width: 1.5; }
    .arrow { stroke: #374151; stroke-width: 1.5; fill: none; marker-end: url(#arrow); }
    .no { stroke: #dc2626; stroke-width: 1.5; fill: none; stroke-dasharray: 5 3; marker-end: url(#arrowr); }
  </style>
  <defs>
    <marker id="arrow" markerWidth="7" markerHeight="7" refX="5" refY="3.5" orient="auto">
      <path d="M0,0 L7,3.5 L0,7 z" fill="#374151"/>
    </marker>
    <marker id="arrowr" markerWidth="7" markerHeight="7" refX="5" refY="3.5" orient="auto">
      <path d="M0,0 L7,3.5 L0,7 z" fill="#dc2626"/>
    </marker>
  </defs>
  <rect width="800" height="320" fill="#ffffff"/>
  <text x="30" y="26" class="heading">IAM: an identity plus a policy decides what is allowed</text>

  <rect x="20" y="70" width="170" height="70" class="who"/>
  <text x="32" y="96" class="mono" fill="#713f12">User "asha"</text>
  <text x="32" y="114" class="label">a person, with MFA</text>
  <rect x="20" y="170" width="170" height="70" class="who"/>
  <text x="32" y="196" class="mono" fill="#713f12">Role "web-server"</text>
  <text x="32" y="214" class="label">assumed by an EC2 server</text>

  <rect x="290" y="70" width="210" height="170" class="pol"/>
  <text x="302" y="94" class="mono" fill="#1e3a8a">Policy (JSON)</text>
  <text x="302" y="120" class="label">Effect:   Allow</text>
  <text x="302" y="138" class="label">Action:   s3:GetObject</text>
  <text x="302" y="156" class="label">Resource: my-bucket/*</text>
  <text x="302" y="190" class="label">Everything not allowed is</text>
  <text x="302" y="206" class="label">denied by default.</text>
  <text x="302" y="222" class="label">An explicit Deny wins.</text>

  <rect x="600" y="70" width="170" height="70" class="res"/>
  <text x="612" y="96" class="mono" fill="#065f46">S3: my-bucket</text>
  <text x="612" y="114" class="label">read allowed</text>
  <rect x="600" y="170" width="170" height="70" class="deny"/>
  <text x="612" y="196" class="mono" fill="#7f1d1d">S3: other-bucket</text>
  <text x="612" y="214" class="label">no policy = denied</text>

  <path d="M190 105 L288 105" class="arrow"/>
  <path d="M190 205 L288 160" class="arrow"/>
  <path d="M500 105 L598 105" class="arrow"/>
  <path d="M500 205 L598 205" class="no"/>
  <text x="30" y="290" class="label">Least privilege: give each user or role only what it needs. Prefer roles (short-lived credentials) to long-lived access keys.</text>
</svg>
