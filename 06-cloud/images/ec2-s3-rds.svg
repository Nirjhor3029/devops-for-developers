<svg viewBox="0 0 800 340" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <style>
    .mono { font-family: 'Courier New', monospace; font-size: 12px; }
    .heading { font-size: 14px; fill: #111827; font-weight: 700; }
    .label { font-size: 11px; fill: #6b7280; }
    .user { fill: #fefce8; stroke: #ca8a04; stroke-width: 1.5; }
    .ec2 { fill: #fff7ed; stroke: #ea580c; stroke-width: 1.5; }
    .s3 { fill: #ecfdf5; stroke: #059669; stroke-width: 1.5; }
    .rds { fill: #eff6ff; stroke: #2563eb; stroke-width: 1.5; }
    .iam { fill: #f5f3ff; stroke: #7c3aed; stroke-width: 1.5; stroke-dasharray: 5 3; }
    .block { fill: #fef2f2; stroke: #dc2626; stroke-width: 1.5; }
    .arrow { stroke: #374151; stroke-width: 1.5; fill: none; marker-end: url(#arrow); }
    .no { stroke: #dc2626; stroke-width: 1.5; fill: none; stroke-dasharray: 5 3; }
  </style>
  <defs>
    <marker id="arrow" markerWidth="7" markerHeight="7" refX="5" refY="3.5" orient="auto">
      <path d="M0,0 L7,3.5 L0,7 z" fill="#374151"/>
    </marker>
  </defs>
  <rect width="800" height="340" fill="#ffffff"/>
  <text x="30" y="26" class="heading">A typical web app on AWS: EC2 + S3 + RDS</text>

  <rect x="15" y="130" width="110" height="70" class="user"/>
  <text x="27" y="156" class="mono" fill="#713f12">Visitors</text>
  <text x="27" y="174" class="label">https://myshop.com</text>

  <rect x="200" y="90" width="210" height="150" class="ec2"/>
  <text x="212" y="114" class="mono" fill="#9a3412">EC2 instance</text>
  <text x="212" y="134" class="label">web server + Laravel</text>
  <text x="212" y="150" class="label">Security group: 80/443 open</text>
  <text x="212" y="166" class="label">disk (EBS): stop keeps it,</text>
  <text x="212" y="182" class="label">terminate deletes it</text>
  <rect x="212" y="196" width="186" height="34" class="iam"/>
  <text x="222" y="217" class="label">IAM role → only my-bucket</text>

  <rect x="520" y="60" width="160" height="80" class="s3"/>
  <text x="532" y="86" class="mono" fill="#065f46">S3 bucket</text>
  <text x="532" y="104" class="label">uploads, backups, logs</text>
  <text x="532" y="120" class="label">private by default</text>

  <rect x="520" y="190" width="160" height="90" class="rds"/>
  <text x="532" y="216" class="mono" fill="#1e3a8a">RDS (MySQL)</text>
  <text x="532" y="234" class="label">managed backups, patches</text>
  <text x="532" y="250" class="label">only the app's security</text>
  <text x="532" y="266" class="label">group may connect</text>

  <rect x="700" y="205" width="85" height="55" class="block"/>
  <text x="708" y="228" class="label" fill="#7f1d1d">Rest of the</text>
  <text x="708" y="244" class="label" fill="#7f1d1d">internet: no</text>

  <path d="M125 165 L198 165" class="arrow"/>
  <path d="M410 125 L518 100" class="arrow"/>
  <path d="M410 200 L518 230" class="arrow"/>
  <path d="M700 232 L682 232" class="no"/>
  <text x="30" y="316" class="label">The app reaches S3 with a role (no keys in code) and the database privately. Only ports 80/443 on the web server face the internet.</text>
</svg>
