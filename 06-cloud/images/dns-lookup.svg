<svg viewBox="0 0 800 330" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <style>
    .mono { font-family: 'Courier New', monospace; font-size: 12px; }
    .heading { font-size: 14px; fill: #111827; font-weight: 700; }
    .label { font-size: 11px; fill: #6b7280; }
    .you { fill: #fefce8; stroke: #ca8a04; stroke-width: 1.5; }
    .res { fill: #eff6ff; stroke: #2563eb; stroke-width: 1.5; }
    .dns { fill: #f5f3ff; stroke: #7c3aed; stroke-width: 1.5; }
    .srv { fill: #ecfdf5; stroke: #059669; stroke-width: 1.5; }
    .arrow { stroke: #374151; stroke-width: 1.5; fill: none; marker-end: url(#arrow); }
    .back { stroke: #059669; stroke-width: 1.5; fill: none; stroke-dasharray: 5 3; marker-end: url(#arrowg); }
    .num { font-size: 11px; fill: #ffffff; font-weight: 700; }
    .dot { fill: #374151; }
  </style>
  <defs>
    <marker id="arrow" markerWidth="7" markerHeight="7" refX="5" refY="3.5" orient="auto">
      <path d="M0,0 L7,3.5 L0,7 z" fill="#374151"/>
    </marker>
    <marker id="arrowg" markerWidth="7" markerHeight="7" refX="5" refY="3.5" orient="auto">
      <path d="M0,0 L7,3.5 L0,7 z" fill="#059669"/>
    </marker>
  </defs>
  <rect width="800" height="330" fill="#ffffff"/>
  <text x="30" y="26" class="heading">What happens when you open myshop.com</text>

  <rect x="20" y="130" width="120" height="70" class="you"/>
  <text x="32" y="156" class="mono" fill="#713f12">Browser</text>
  <text x="32" y="176" class="label">"myshop.com?"</text>

  <rect x="210" y="130" width="130" height="70" class="res"/>
  <text x="222" y="156" class="mono" fill="#1e3a8a">Resolver</text>
  <text x="222" y="176" class="label">ISP / 1.1.1.1 / 8.8.8.8</text>
  <text x="222" y="190" class="label">remembers (TTL)</text>

  <rect x="430" y="45" width="150" height="50" class="dns"/>
  <text x="442" y="68" class="mono" fill="#4c1d95">Root server</text>
  <text x="442" y="84" class="label">"who has .com?"</text>
  <rect x="430" y="140" width="150" height="50" class="dns"/>
  <text x="442" y="163" class="mono" fill="#4c1d95">.com TLD server</text>
  <text x="442" y="179" class="label">"NS for myshop.com"</text>
  <rect x="430" y="235" width="150" height="50" class="dns"/>
  <text x="442" y="258" class="mono" fill="#4c1d95">Your DNS host</text>
  <text x="442" y="274" class="label">"A = 203.0.113.10"</text>

  <rect x="650" y="235" width="130" height="50" class="srv"/>
  <text x="662" y="258" class="mono" fill="#065f46">Your VPS</text>
  <text x="662" y="274" class="label">203.0.113.10</text>

  <path d="M140 155 L208 155" class="arrow"/>
  <path d="M340 140 L428 75" class="arrow"/>
  <path d="M340 165 L428 165" class="arrow"/>
  <path d="M340 190 L428 255" class="arrow"/>
  <path d="M208 185 L142 185" class="back"/>
  <path d="M580 260 L648 260" class="arrow"/>

  <circle cx="174" cy="145" r="9" class="dot"/><text x="170" y="149" class="num">1</text>
  <circle cx="384" cy="100" r="9" class="dot"/><text x="380" y="104" class="num">2</text>
  <circle cx="384" cy="156" r="9" class="dot"/><text x="380" y="160" class="num">3</text>
  <circle cx="384" cy="226" r="9" class="dot"/><text x="380" y="230" class="num">4</text>
  <circle cx="174" cy="198" r="9" class="dot"/><text x="170" y="202" class="num">5</text>
  <text x="20" y="310" class="label">5: the IP goes back to the browser, which then connects to the VPS. The resolver caches the answer until the TTL runs out.</text>
</svg>
