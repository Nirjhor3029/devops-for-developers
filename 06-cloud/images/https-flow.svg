<svg viewBox="0 0 800 320" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <style>
    .mono { font-family: 'Courier New', monospace; font-size: 12px; }
    .heading { font-size: 14px; fill: #111827; font-weight: 700; }
    .label { font-size: 11px; fill: #6b7280; }
    .you { fill: #fefce8; stroke: #ca8a04; stroke-width: 1.5; }
    .web { fill: #eff6ff; stroke: #2563eb; stroke-width: 1.5; }
    .app { fill: #ecfdf5; stroke: #059669; stroke-width: 1.5; }
    .arrow { stroke: #374151; stroke-width: 1.5; fill: none; marker-end: url(#arrow); }
    .sec { stroke: #059669; stroke-width: 3; fill: none; marker-end: url(#arrowg); }
    .num { font-size: 11px; fill: #ffffff; font-weight: 700; }
    .dot { fill: #374151; }
  </style>
  <defs>
    <marker id="arrow" markerWidth="7" markerHeight="7" refX="5" refY="3.5" orient="auto">
      <path d="M0,0 L7,3.5 L0,7 z" fill="#374151"/>
    </marker>
    <marker id="arrowg" markerWidth="7" markerHeight="7" refX="5" refY="3.5" orient="auto">
      <path d="M0,0 L7,3.5 L0,7 z" fill="#059669"/>
    </marker>
  </defs>
  <rect width="800" height="320" fill="#ffffff"/>
  <text x="30" y="26" class="heading">HTTP is redirected to HTTPS; TLS ends at the web server</text>

  <rect x="20" y="110" width="130" height="90" class="you"/>
  <text x="32" y="136" class="mono" fill="#713f12">Browser</text>
  <text x="32" y="156" class="label">types myshop.com</text>
  <text x="32" y="172" class="label">padlock = verified</text>

  <rect x="330" y="70" width="190" height="170" class="web"/>
  <text x="342" y="94" class="mono" fill="#1e3a8a">Web server</text>
  <text x="342" y="112" class="label">Nginx or Caddy</text>
  <text x="342" y="140" class="mono" fill="#1e3a8a">:80  → redirect</text>
  <text x="342" y="162" class="mono" fill="#1e3a8a">:443 → TLS + routes</text>
  <text x="342" y="190" class="label">holds the certificate</text>
  <text x="342" y="206" class="label">(Let's Encrypt, 90 days,</text>
  <text x="342" y="222" class="label"> renewed automatically)</text>

  <rect x="640" y="110" width="140" height="90" class="app"/>
  <text x="652" y="136" class="mono" fill="#065f46">Your app</text>
  <text x="652" y="156" class="label">PHP-FPM / container</text>
  <text x="652" y="172" class="label">127.0.0.1:8080</text>
  <text x="652" y="188" class="label">(private, not public)</text>

  <path d="M150 135 L328 135" class="arrow"/>
  <path d="M328 160 L152 160" class="arrow"/>
  <path d="M150 188 L328 188" class="sec"/>
  <path d="M520 155 L638 155" class="arrow"/>

  <circle cx="240" cy="124" r="9" class="dot"/><text x="236" y="128" class="num">1</text>
  <circle cx="240" cy="150" r="9" class="dot"/><text x="236" y="154" class="num">2</text>
  <circle cx="240" cy="177" r="9" class="dot"/><text x="236" y="181" class="num">3</text>
  <text x="30" y="270" class="label">1: plain http://myshop.com arrives on port 80.   2: the server answers "301, use https://".</text>
  <text x="30" y="288" class="label">3: the browser reconnects on 443 over TLS (thick green = encrypted). The server forwards the request to the app locally.</text>
</svg>
