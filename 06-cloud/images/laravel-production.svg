<svg viewBox="0 0 800 380" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <style>
    .mono { font-family: 'Courier New', monospace; font-size: 12px; }
    .heading { font-size: 14px; fill: #111827; font-weight: 700; }
    .label { font-size: 11px; fill: #6b7280; }
    .user { fill: #fefce8; stroke: #ca8a04; stroke-width: 1.5; }
    .dns { fill: #f5f3ff; stroke: #7c3aed; stroke-width: 1.5; }
    .srv { fill: #f9fafb; stroke: #6b7280; stroke-width: 1.5; stroke-dasharray: 6 4; }
    .web { fill: #eff6ff; stroke: #2563eb; stroke-width: 1.5; }
    .app { fill: #ecfdf5; stroke: #059669; stroke-width: 1.5; }
    .db { fill: #fff7ed; stroke: #ea580c; stroke-width: 1.5; }
    .bk { fill: #fef2f2; stroke: #dc2626; stroke-width: 1.5; }
    .arrow { stroke: #374151; stroke-width: 1.5; fill: none; marker-end: url(#arrow); }
    .dash { stroke: #6b7280; stroke-width: 1.3; fill: none; stroke-dasharray: 5 3; marker-end: url(#arrow); }
  </style>
  <defs>
    <marker id="arrow" markerWidth="7" markerHeight="7" refX="5" refY="3.5" orient="auto">
      <path d="M0,0 L7,3.5 L0,7 z" fill="#374151"/>
    </marker>
  </defs>
  <rect width="800" height="380" fill="#ffffff"/>
  <text x="30" y="26" class="heading">A Laravel app in production on one server</text>

  <rect x="10" y="120" width="100" height="70" class="user"/>
  <text x="20" y="146" class="mono" fill="#713f12">Visitors</text>
  <text x="20" y="164" class="label">myshop.com</text>

  <rect x="10" y="225" width="100" height="55" class="dns"/>
  <text x="20" y="248" class="mono" fill="#4c1d95">DNS</text>
  <text x="20" y="264" class="label">A → server IP</text>

  <rect x="140" y="45" width="500" height="300" class="srv"/>
  <text x="150" y="63" class="mono" fill="#374151">VPS / EC2 (Ubuntu), UFW: 22 (you), 80, 443</text>

  <rect x="160" y="85" width="150" height="90" class="web"/>
  <text x="170" y="108" class="mono" fill="#1e3a8a">Nginx / Caddy</text>
  <text x="170" y="126" class="label">HTTPS (Let's Encrypt)</text>
  <text x="170" y="142" class="label">root = /public</text>
  <text x="170" y="158" class="label">HTTP → HTTPS</text>

  <rect x="350" y="85" width="270" height="90" class="app"/>
  <text x="360" y="108" class="mono" fill="#065f46">PHP-FPM + Laravel</text>
  <text x="360" y="126" class="label">APP_ENV=production, APP_DEBUG=false</text>
  <text x="360" y="142" class="label">config/route/view cached</text>
  <text x="360" y="158" class="label">deploy.sh: pull, composer, migrate</text>

  <rect x="350" y="205" width="130" height="60" class="app"/>
  <text x="360" y="228" class="mono" fill="#065f46">Queue worker</text>
  <text x="360" y="246" class="label">systemd, restarts</text>
  <rect x="490" y="205" width="130" height="60" class="app"/>
  <text x="500" y="228" class="mono" fill="#065f46">Scheduler</text>
  <text x="500" y="246" class="label">cron, every minute</text>

  <rect x="160" y="205" width="150" height="110" class="db"/>
  <text x="170" y="228" class="mono" fill="#9a3412">MySQL</text>
  <text x="170" y="246" class="label">localhost only</text>
  <text x="170" y="262" class="label">user limited to</text>
  <text x="170" y="278" class="label">one database</text>
  <text x="170" y="298" class="label">port 3306 closed</text>

  <rect x="660" y="205" width="130" height="85" class="bk"/>
  <text x="670" y="228" class="mono" fill="#7f1d1d">Backups</text>
  <text x="670" y="246" class="label">nightly dump → S3</text>
  <text x="670" y="262" class="label">copy off the server</text>
  <text x="670" y="278" class="label">restore tested</text>

  <path d="M110 155 L158 140" class="arrow"/>
  <path d="M60 225 L60 192" class="dash"/>
  <path d="M310 130 L348 130" class="arrow"/>
  <path d="M420 175 L420 203" class="arrow"/>
  <path d="M350 160 L312 215" class="arrow"/>
  <path d="M310 270 L660 270" class="dash"/>
  <text x="30" y="368" class="label">Add: uptime monitor, logs (storage/logs, nginx), disk checks, a cost budget. On AWS: EC2 + RDS (private) + S3 + Route 53 + security groups.</text>
</svg>
