<svg viewBox="0 0 760 420" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <style>
    .layer { stroke: #1f2937; stroke-width: 1.5; }
    .label { font-size: 16px; fill: #111827; }
    .sub { font-size: 12px; fill: #4b5563; }
    .tag { font-size: 12px; fill: #ffffff; font-weight: 600; }
  </style>
  <rect width="760" height="420" fill="#ffffff"/>

  <!-- Base OS layer -->
  <rect x="140" y="300" width="380" height="55" rx="6" class="layer" fill="#60a5fa"/>
  <text x="160" y="333" class="tag">Layer 1 — Base OS (e.g. ubuntu:22.04)</text>

  <!-- Dependencies layer -->
  <rect x="140" y="245" width="380" height="55" rx="6" class="layer" fill="#34d399"/>
  <text x="160" y="278" class="tag">Layer 2 — Install dependencies (apt-get, composer)</text>

  <!-- App code layer -->
  <rect x="140" y="190" width="380" height="55" rx="6" class="layer" fill="#fbbf24"/>
  <text x="160" y="223" class="tag">Layer 3 — Copy app code (COPY . /app)</text>

  <!-- Writable container layer -->
  <rect x="140" y="135" width="380" height="55" rx="6" class="layer" fill="#f472b6" stroke-dasharray="6,4"/>
  <text x="160" y="168" class="tag">Container's writable layer (temporary)</text>

  <!-- Image bracket -->
  <line x1="110" y1="190" x2="110" y2="355" stroke="#111827" stroke-width="1.5"/>
  <line x1="100" y1="190" x2="110" y2="190" stroke="#111827" stroke-width="1.5"/>
  <line x1="100" y1="355" x2="110" y2="355" stroke="#111827" stroke-width="1.5"/>
  <text x="40" y="278" class="label" transform="rotate(-90 40 278)" text-anchor="middle">IMAGE (read-only)</text>

  <!-- Container bracket -->
  <line x1="650" y1="135" x2="650" y2="355" stroke="#111827" stroke-width="1.5"/>
  <line x1="650" y1="135" x2="660" y2="135" stroke="#111827" stroke-width="1.5"/>
  <line x1="650" y1="355" x2="660" y2="355" stroke="#111827" stroke-width="1.5"/>
  <text x="700" y="248" class="label" transform="rotate(-90 700 248)" text-anchor="middle">CONTAINER = image + writable layer</text>

  <!-- Footer note -->
  <text x="140" y="400" class="sub">Each layer only stores what changed from the layer below it — that's why Docker can reuse and cache layers between images.</text>
</svg>
