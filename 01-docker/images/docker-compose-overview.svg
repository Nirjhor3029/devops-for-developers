<svg viewBox="0 0 800 420" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <style>
    .box { stroke: #1f2937; stroke-width: 1.5; }
    .title { font-size: 14px; fill: #ffffff; font-weight: 700; }
    .sub { font-size: 11px; fill: #f3f4f6; }
    .label { font-size: 12px; fill: #374151; }
    .hostline { stroke: #2563eb; stroke-width: 2; fill: none; }
    .vline { stroke: #d97706; stroke-width: 2; stroke-dasharray: 5,4; fill: none; }
  </style>
  <rect width="800" height="420" fill="#ffffff"/>

  <!-- host machine -->
  <rect x="20" y="20" width="760" height="60" rx="8" fill="#f3f4f6" stroke="#9ca3af"/>
  <text x="36" y="55" class="label" font-weight="700">Your machine (host) — localhost</text>
  <text x="300" y="55" class="label">localhost:3000 → app</text>
  <text x="520" y="55" class="label">localhost:8081 → adminer</text>

  <!-- compose project network -->
  <rect x="60" y="110" width="680" height="230" rx="12" fill="#eff6ff" stroke="#93c5fd" stroke-dasharray="6,4"/>
  <text x="80" y="134" class="label" fill="#1d4ed8" font-weight="700">docker-compose.yml creates this network automatically — every service can reach the others by name</text>

  <!-- app -->
  <rect x="90" y="160" width="160" height="80" rx="8" class="box" fill="#60a5fa"/>
  <text x="105" y="195" class="title">app</text>
  <text x="105" y="215" class="sub">build: ./  (Dockerfile)</text>
  <text x="105" y="230" class="sub">ports: 3000:3000</text>

  <!-- db -->
  <rect x="330" y="160" width="160" height="80" rx="8" class="box" fill="#34d399"/>
  <text x="345" y="195" class="title">db</text>
  <text x="345" y="215" class="sub">image: mysql:8</text>
  <text x="345" y="230" class="sub">no host port — internal only</text>

  <!-- adminer -->
  <rect x="570" y="160" width="140" height="80" rx="8" class="box" fill="#a78bfa"/>
  <text x="585" y="195" class="title">adminer</text>
  <text x="585" y="215" class="sub">image: adminer</text>
  <text x="585" y="230" class="sub">ports: 8081:8080</text>

  <!-- connections between app/db and db/adminer -->
  <path d="M250 200 L330 200" class="hostline" marker-end="url(#a1)"/>
  <text x="258" y="190" class="label" fill="#1d4ed8" font-size="11">app → db:3306</text>
  <path d="M490 215 L570 215" class="hostline" marker-end="url(#a1)"/>
  <text x="498" y="206" class="label" fill="#1d4ed8" font-size="11">adminer → db</text>

  <!-- volume for db -->
  <g transform="translate(395,270)">
    <ellipse cx="35" cy="8" rx="35" ry="10" fill="#fde68a" stroke="#d97706" stroke-width="1.5"/>
    <path d="M0 8 L0 42 A35 10 0 0 0 70 42 L70 8" fill="#fde68a" stroke="#d97706" stroke-width="1.5"/>
    <ellipse cx="35" cy="42" rx="35" ry="10" fill="#fde68a" stroke="#d97706" stroke-width="1.5"/>
    <text x="35" y="30" class="label" text-anchor="middle" fill="#78350f" font-size="11">db-data</text>
  </g>
  <path d="M410 240 L415 270" class="vline" marker-end="url(#a2)"/>

  <!-- host port lines -->
  <path d="M170 160 L170 80" class="hostline" marker-end="url(#a1)"/>
  <path d="M640 160 L640 80" class="hostline" marker-end="url(#a1)"/>

  <defs>
    <marker id="a1" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#2563eb"/></marker>
    <marker id="a2" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#d97706"/></marker>
  </defs>

  <text x="60" y="375" class="label" fill="#4b5563">One file, one command (`docker compose up`) starts all three services, puts them on the same network,</text>
  <text x="60" y="393" class="label" fill="#4b5563">and attaches the named volume to "db" — everything Chapters 2–5 did by hand, declared and automated.</text>
</svg>
