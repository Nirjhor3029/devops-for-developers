<svg viewBox="0 0 800 380" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <style>
    .mono { font-family: 'Courier New', monospace; font-size: 12px; }
    .ok { fill: #2563eb; stroke: #1f2937; stroke-width: 1; }
    .bad { fill: #dc2626; stroke: #1f2937; stroke-width: 1; }
    .new { fill: #059669; stroke: #1f2937; stroke-width: 1; }
    .ghost { fill: #e5e7eb; stroke: #9ca3af; stroke-width: 1; stroke-dasharray: 3,2; }
    .heading { font-size: 14px; fill: #111827; font-weight: 700; }
    .label { font-size: 12px; fill: #6b7280; }
    .line { stroke: #9ca3af; stroke-width: 2; }
  </style>
  <rect width="800" height="380" fill="#ffffff"/>

  <text x="30" y="26" class="heading">Before — three commits, the last one (C) is a mistake</text>
  <line x1="30" y1="60" x2="300" y2="60" class="line"/>
  <circle cx="60" cy="60" r="6" class="ok"/>
  <text x="50" y="45" class="label">A</text>
  <circle cx="160" cy="60" r="6" class="ok"/>
  <text x="150" y="45" class="label">B</text>
  <circle cx="260" cy="60" r="7" class="bad"/>
  <text x="240" y="45" class="label" fill="#991b1b">C (bad)</text>
  <text x="310" y="64" class="label">← HEAD / main</text>

  <text x="30" y="120" class="heading">git reset --hard B  →  moves the branch pointer, C is gone from history</text>
  <line x1="30" y1="155" x2="200" y2="155" class="line"/>
  <circle cx="60" cy="155" r="6" class="ok"/>
  <circle cx="160" cy="155" r="6" class="ok"/>
  <text x="210" y="159" class="label">← HEAD / main (now points here)</text>
  <circle cx="260" cy="155" r="6" class="ghost"/>
  <text x="245" y="175" class="label" fill="#9ca3af">C still exists, just unreferenced</text>
  <text x="30" y="200" class="label" fill="#991b1b">Safe only if nobody has pulled C — rewrites what main points to.</text>

  <text x="30" y="250" class="heading">git revert C  →  adds a NEW commit that undoes C's changes — nothing deleted</text>
  <line x1="30" y1="285" x2="400" y2="285" class="line"/>
  <circle cx="60" cy="285" r="6" class="ok"/>
  <circle cx="160" cy="285" r="6" class="ok"/>
  <circle cx="260" cy="285" r="6" class="bad"/>
  <circle cx="360" cy="285" r="7" class="new"/>
  <text x="330" y="270" class="label" fill="#065f46">"Revert C"</text>
  <text x="410" y="289" class="label">← HEAD / main</text>
  <text x="30" y="330" class="label" fill="#065f46">Safe on a shared/pushed branch — C stays in history, a new commit just cancels its effect.</text>

  <text x="30" y="365" class="label">Rule of thumb: reset for commits only YOU have (not pushed, or pushed but nobody pulled); revert once others may have it.</text>
</svg>
