<svg viewBox="0 0 800 400" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <style>
    .heading { font-size: 14px; fill: #111827; font-weight: 700; }
    .t { font-size: 13px; font-weight: 700; }
    .label { font-size: 12px; fill: #1f2937; }
    .code { font-family: 'Courier New', monospace; font-size: 11px; fill: #1f2937; }
    .note { font-size: 11px; fill: #6b7280; }
    .step { fill: #f5f3ff; stroke: #7c3aed; stroke-width: 2; }
    .plan { fill: #eff6ff; stroke: #2563eb; stroke-width: 2; }
    .app { fill: #ecfdf5; stroke: #059669; stroke-width: 2; }
    .del { fill: #fef2f2; stroke: #dc2626; stroke-width: 2; }
    .yes { fill: #ecfdf5; stroke: #059669; stroke-width: 1.5; }
    .no { fill: #fef2f2; stroke: #dc2626; stroke-width: 1.5; }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#374151"/></marker>
  </defs>
  <rect width="800" height="400" fill="#ffffff"/>
  <text x="15" y="26" class="heading">The Terraform loop: you see the change before it happens</text>

  <rect x="15" y="50" width="130" height="78" rx="8" class="step"/>
  <text x="80" y="76" text-anchor="middle" class="t" fill="#5b21b6">1. Write</text>
  <text x="80" y="96" text-anchor="middle" class="code">main.tf</text>
  <text x="80" y="114" text-anchor="middle" class="note">declare the end state</text>

  <rect x="175" y="50" width="130" height="78" rx="8" class="step"/>
  <text x="240" y="76" text-anchor="middle" class="t" fill="#5b21b6">2. init</text>
  <text x="240" y="96" text-anchor="middle" class="code">terraform init</text>
  <text x="240" y="114" text-anchor="middle" class="note">download providers</text>

  <rect x="335" y="50" width="130" height="78" rx="8" class="plan"/>
  <text x="400" y="76" text-anchor="middle" class="t" fill="#1e3a8a">3. Plan</text>
  <text x="400" y="96" text-anchor="middle" class="code">terraform plan</text>
  <text x="400" y="114" text-anchor="middle" class="note">preview, changes nothing</text>

  <rect x="495" y="50" width="130" height="78" rx="8" class="app"/>
  <text x="560" y="76" text-anchor="middle" class="t" fill="#065f46">4. Apply</text>
  <text x="560" y="96" text-anchor="middle" class="code">terraform apply</text>
  <text x="560" y="114" text-anchor="middle" class="note">type yes to approve</text>

  <rect x="655" y="50" width="130" height="78" rx="8" class="del"/>
  <text x="720" y="76" text-anchor="middle" class="t" fill="#991b1b">5. Destroy</text>
  <text x="720" y="96" text-anchor="middle" class="code">terraform destroy</text>
  <text x="720" y="114" text-anchor="middle" class="note">no undo</text>

  <line x1="147" y1="89" x2="173" y2="89" stroke="#374151" stroke-width="1.5" marker-end="url(#a)"/>
  <line x1="307" y1="89" x2="333" y2="89" stroke="#374151" stroke-width="1.5" marker-end="url(#a)"/>
  <line x1="467" y1="89" x2="493" y2="89" stroke="#374151" stroke-width="1.5" marker-end="url(#a)"/>
  <line x1="627" y1="89" x2="653" y2="89" stroke="#374151" stroke-width="1.5" marker-end="url(#a)"/>

  <text x="15" y="166" class="heading">Reading a plan</text>
  <text x="15" y="188" class="code">+   create        -   destroy        ~   update in place        -/+   replace (destroy, then create)</text>
  <text x="15" y="208" class="note">Look for - and -/+ first: those delete or recreate something.</text>

  <text x="15" y="244" class="heading">What goes in Git?</text>
  <rect x="15" y="254" width="250" height="40" rx="6" class="yes"/>
  <text x="25" y="272" class="code">main.tf  (your .tf files)</text>
  <text x="25" y="287" class="note">commit: this is your infrastructure code</text>
  <rect x="285" y="254" width="250" height="40" rx="6" class="yes"/>
  <text x="295" y="272" class="code">.terraform.lock.hcl</text>
  <text x="295" y="287" class="note">commit: pins exact provider versions</text>
  <rect x="15" y="304" width="250" height="40" rx="6" class="no"/>
  <text x="25" y="322" class="code">.terraform/</text>
  <text x="35" y="337" class="note">do not commit: downloaded plugins</text>
  <rect x="285" y="304" width="250" height="40" rx="6" class="no"/>
  <text x="295" y="322" class="code">terraform.tfstate</text>
  <text x="295" y="337" class="note">NEVER commit: secrets in plain text</text>

  <text x="15" y="374" class="note">First project uses the Docker provider: runs on your own machine, no cloud account, no cost.</text>
</svg>
