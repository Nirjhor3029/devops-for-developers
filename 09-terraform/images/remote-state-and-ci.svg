<svg viewBox="0 0 800 400" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <style>
    .heading { font-size: 14px; fill: #111827; font-weight: 700; }
    .t { font-size: 13px; font-weight: 700; }
    .label { font-size: 12px; fill: #1f2937; }
    .code { font-family: 'Courier New', monospace; font-size: 11px; fill: #1f2937; }
    .note { font-size: 11px; fill: #6b7280; }
    .dev { fill: #eff6ff; stroke: #2563eb; stroke-width: 2; }
    .st { fill: #f5f3ff; stroke: #7c3aed; stroke-width: 2; }
    .ci { fill: #ecfdf5; stroke: #059669; stroke-width: 2; }
    .warn { fill: #fef2f2; stroke: #dc2626; stroke-width: 1.5; }
    .step { fill: #fff7ed; stroke: #ea580c; stroke-width: 1.5; }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#374151"/></marker>
  </defs>
  <rect width="800" height="400" fill="#ffffff"/>
  <text x="15" y="26" class="heading">One shared, locked state; CI plans every pull request</text>

  <rect x="15" y="44" width="150" height="46" rx="6" class="dev"/><text x="90" y="72" text-anchor="middle" class="label">Teammate A</text>
  <rect x="15" y="100" width="150" height="46" rx="6" class="dev"/><text x="90" y="128" text-anchor="middle" class="label">Teammate B</text>
  <rect x="15" y="156" width="150" height="46" rx="6" class="ci"/><text x="90" y="184" text-anchor="middle" class="label">CI job</text>

  <rect x="290" y="64" width="240" height="120" rx="8" class="st"/>
  <text x="410" y="88" text-anchor="middle" class="t" fill="#5b21b6">Remote backend</text>
  <text x="410" y="108" text-anchor="middle" class="code">backend "s3" { bucket, key }</text>
  <text x="410" y="128" text-anchor="middle" class="label">one state, one safe home</text>
  <text x="410" y="146" text-anchor="middle" class="note">locking: one run at a time</text>
  <text x="410" y="164" text-anchor="middle" class="note">encryption + versioning + tight access</text>

  <line x1="167" y1="67" x2="288" y2="100" stroke="#374151" stroke-width="1.5" marker-end="url(#a)"/>
  <line x1="167" y1="123" x2="288" y2="124" stroke="#374151" stroke-width="1.5" marker-end="url(#a)"/>
  <line x1="167" y1="179" x2="288" y2="150" stroke="#374151" stroke-width="1.5" marker-end="url(#a)"/>

  <rect x="580" y="64" width="205" height="120" rx="8" class="warn"/>
  <text x="682" y="88" text-anchor="middle" class="t" fill="#991b1b">Never</text>
  <text x="682" y="110" text-anchor="middle" class="label">state or plan files in Git</text>
  <text x="682" y="128" text-anchor="middle" class="label">secrets in the backend block</text>
  <text x="682" y="146" text-anchor="middle" class="label">dev and prod as workspaces</text>
  <text x="682" y="164" text-anchor="middle" class="note">use separate configs + modules</text>

  <text x="15" y="236" class="heading">The pull-request flow</text>
  <rect x="15" y="246" width="135" height="50" rx="6" class="step"/><text x="82" y="266" text-anchor="middle" class="label">1. Open PR</text><text x="82" y="284" text-anchor="middle" class="note">code change</text>
  <rect x="170" y="246" width="150" height="50" rx="6" class="step"/><text x="245" y="266" text-anchor="middle" class="label">2. CI: fmt, validate,</text><text x="245" y="284" text-anchor="middle" class="label">plan (read-only token)</text>
  <rect x="340" y="246" width="135" height="50" rx="6" class="step"/><text x="407" y="266" text-anchor="middle" class="label">3. Human reads</text><text x="407" y="284" text-anchor="middle" class="note">the plan like a diff</text>
  <rect x="495" y="246" width="135" height="50" rx="6" class="step"/><text x="562" y="266" text-anchor="middle" class="label">4. Merge to main</text><text x="562" y="284" text-anchor="middle" class="note">approval required</text>
  <rect x="650" y="246" width="135" height="50" rx="6" class="ci"/><text x="717" y="266" text-anchor="middle" class="label">5. Apply the</text><text x="717" y="284" text-anchor="middle" class="label">saved plan</text>
  <line x1="152" y1="271" x2="168" y2="271" stroke="#374151" stroke-width="1.5" marker-end="url(#a)"/>
  <line x1="322" y1="271" x2="338" y2="271" stroke="#374151" stroke-width="1.5" marker-end="url(#a)"/>
  <line x1="477" y1="271" x2="493" y2="271" stroke="#374151" stroke-width="1.5" marker-end="url(#a)"/>
  <line x1="632" y1="271" x2="648" y2="271" stroke="#374151" stroke-width="1.5" marker-end="url(#a)"/>

  <text x="15" y="330" class="code">terraform init -input=false</text>
  <text x="15" y="348" class="code">terraform plan -out=tfplan -input=false     then     terraform apply -input=false tfplan</text>
  <text x="15" y="372" class="note">Changing the backend: -migrate-state copies your state; -reconfigure does NOT. Copy the state file first.</text>
</svg>
