<svg viewBox="0 0 800 400" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <style>
    .heading { font-size: 14px; fill: #111827; font-weight: 700; }
    .t { font-size: 13px; font-weight: 700; }
    .label { font-size: 12px; fill: #1f2937; }
    .code { font-family: 'Courier New', monospace; font-size: 11px; fill: #1f2937; }
    .note { font-size: 11px; fill: #6b7280; }
    .play { fill: #f5f3ff; stroke: #7c3aed; stroke-width: 2; }
    .task { fill: #eff6ff; stroke: #2563eb; stroke-width: 1.5; }
    .chg { fill: #fff7ed; stroke: #ea580c; stroke-width: 1.5; }
    .hnd { fill: #ecfdf5; stroke: #059669; stroke-width: 2; }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#374151"/></marker>
  </defs>
  <rect width="800" height="400" fill="#ffffff"/>
  <text x="15" y="26" class="heading">One play: tasks run top to bottom, the handler runs once at the end, only if something changed</text>

  <rect x="15" y="44" width="500" height="300" rx="8" class="play"/>
  <text x="30" y="68" class="t" fill="#5b21b6">Play: Prepare web servers</text>
  <text x="30" y="86" class="code">hosts: web     become: true</text>

  <rect x="35" y="100" width="460" height="38" rx="6" class="task"/>
  <text x="48" y="116" class="label">1. Base packages are installed</text>
  <text x="48" y="131" class="note">module: apt</text>
  <rect x="35" y="146" width="460" height="38" rx="6" class="task"/>
  <text x="48" y="162" class="label">2. App directory exists</text>
  <text x="48" y="177" class="note">module: file</text>
  <rect x="35" y="192" width="460" height="46" rx="6" class="chg"/>
  <text x="48" y="208" class="label">3. Web server config is in place</text>
  <text x="48" y="223" class="note">module: copy      notify: Restart caddy</text>
  <rect x="35" y="246" width="460" height="38" rx="6" class="task"/>
  <text x="48" y="262" class="label">4. Caddy is running</text>
  <text x="48" y="277" class="note">module: service</text>
  <text x="35" y="306" class="note">Each task = a name + ONE module.  Order = top to bottom.</text>
  <text x="35" y="324" class="note">PLAY RECAP at the end: ok / changed / failed per host.</text>

  <rect x="570" y="192" width="215" height="92" rx="8" class="hnd"/>
  <text x="677" y="216" text-anchor="middle" class="t" fill="#065f46">Handler</text>
  <text x="677" y="236" text-anchor="middle" class="label">Restart caddy</text>
  <text x="677" y="256" text-anchor="middle" class="note">runs ONLY if task 3 changed,</text>
  <text x="677" y="271" text-anchor="middle" class="note">once, after all tasks finish</text>
  <line x1="497" y1="215" x2="568" y2="230" stroke="#374151" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="508" y="205" class="note">notify</text>

  <rect x="570" y="70" width="215" height="92" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="677" y="94" text-anchor="middle" class="t" fill="#991b1b">Second run</text>
  <text x="677" y="114" text-anchor="middle" class="label">nothing differs</text>
  <text x="677" y="134" text-anchor="middle" class="label">changed=0</text>
  <text x="677" y="150" text-anchor="middle" class="note">no restart, no change</text>

  <text x="15" y="372" class="note">Idempotent: running it again changes nothing. Check with --check first, then apply, then run twice.</text>
</svg>
