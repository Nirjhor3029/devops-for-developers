<svg viewBox="0 0 800 400" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <style>
    .heading { font-size: 14px; fill: #111827; font-weight: 700; }
    .t { font-size: 13px; font-weight: 700; }
    .label { font-size: 12px; fill: #1f2937; }
    .note { font-size: 11px; fill: #6b7280; }
    .bad { fill: #fef2f2; stroke: #dc2626; stroke-width: 1.5; }
    .good { fill: #ecfdf5; stroke: #059669; stroke-width: 1.5; }
    .code { fill: #eff6ff; stroke: #2563eb; stroke-width: 2; }
    .tool { fill: #f5f3ff; stroke: #7c3aed; stroke-width: 2; }
    .srv { fill: #fff7ed; stroke: #ea580c; stroke-width: 1.5; }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#374151"/></marker>
  </defs>
  <rect width="800" height="400" fill="#ffffff"/>
  <text x="15" y="26" class="heading">Same goal, two ways: a server you can rebuild, or a server you hope nobody loses</text>

  <rect x="15" y="44" width="375" height="250" rx="8" class="bad"/>
  <text x="202" y="70" text-anchor="middle" class="t" fill="#991b1b">By hand</text>
  <rect x="40" y="90" width="150" height="44" rx="6" fill="#ffffff" stroke="#dc2626"/>
  <text x="115" y="108" text-anchor="middle" class="label">You, typing</text>
  <text x="115" y="124" text-anchor="middle" class="note">over SSH, from memory</text>
  <rect x="240" y="90" width="130" height="44" rx="6" class="srv"/>
  <text x="305" y="108" text-anchor="middle" class="label">Server A</text>
  <text x="305" y="124" text-anchor="middle" class="note">"snowflake"</text>
  <line x1="190" y1="112" x2="238" y2="112" stroke="#374151" stroke-width="1.5" marker-end="url(#a)"/>
  <rect x="240" y="150" width="130" height="44" rx="6" class="srv"/>
  <text x="305" y="168" text-anchor="middle" class="label">Server B</text>
  <text x="305" y="184" text-anchor="middle" class="note">slightly different</text>
  <line x1="190" y1="124" x2="238" y2="168" stroke="#374151" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="40" y="224" class="label">- steps live in someone's head</text>
  <text x="40" y="244" class="label">- no review before it runs</text>
  <text x="40" y="264" class="label">- servers drift apart</text>
  <text x="40" y="284" class="label">- rebuild after a crash = hours</text>

  <rect x="410" y="44" width="375" height="250" rx="8" class="good"/>
  <text x="597" y="70" text-anchor="middle" class="t" fill="#065f46">As code</text>
  <rect x="425" y="90" width="110" height="44" rx="6" class="code"/>
  <text x="480" y="108" text-anchor="middle" class="label">Code in Git</text>
  <text x="480" y="124" text-anchor="middle" class="note">reviewed, versioned</text>
  <rect x="560" y="90" width="90" height="44" rx="6" class="tool"/>
  <text x="605" y="108" text-anchor="middle" class="label">Tool</text>
  <text x="605" y="124" text-anchor="middle" class="note">plan, apply</text>
  <rect x="675" y="90" width="95" height="44" rx="6" class="srv"/>
  <text x="722" y="108" text-anchor="middle" class="label">Server A</text>
  <text x="722" y="124" text-anchor="middle" class="note">from the code</text>
  <rect x="675" y="150" width="95" height="44" rx="6" class="srv"/>
  <text x="722" y="168" text-anchor="middle" class="label">Server B</text>
  <text x="722" y="184" text-anchor="middle" class="note">identical</text>
  <line x1="535" y1="112" x2="558" y2="112" stroke="#374151" stroke-width="1.5" marker-end="url(#a)"/>
  <line x1="650" y1="112" x2="673" y2="112" stroke="#374151" stroke-width="1.5" marker-end="url(#a)"/>
  <line x1="650" y1="124" x2="673" y2="168" stroke="#374151" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="425" y="224" class="label">- the code IS the documentation</text>
  <text x="425" y="244" class="label">- a teammate reviews the change</text>
  <text x="425" y="264" class="label">- every copy is the same</text>
  <text x="425" y="284" class="label">- rebuild after a crash = minutes</text>

  <rect x="15" y="312" width="375" height="64" rx="8" class="tool"/>
  <text x="202" y="336" text-anchor="middle" class="t" fill="#5b21b6">Terraform / OpenTofu</text>
  <text x="202" y="358" text-anchor="middle" class="label">builds the house: servers, networks, DNS</text>
  <rect x="410" y="312" width="375" height="64" rx="8" class="tool"/>
  <text x="597" y="336" text-anchor="middle" class="t" fill="#5b21b6">Ansible</text>
  <text x="597" y="358" text-anchor="middle" class="label">furnishes it: packages, files, services</text>
</svg>
