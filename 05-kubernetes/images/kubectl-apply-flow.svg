<svg viewBox="0 0 800 330" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <style>
    .mono { font-family: 'Courier New', monospace; font-size: 12px; }
    .you { fill: #fefce8; stroke: #ca8a04; stroke-width: 1.5; }
    .cp { fill: #eff6ff; stroke: #2563eb; stroke-width: 1.5; }
    .node { fill: #ecfdf5; stroke: #059669; stroke-width: 1.5; }
    .heading { font-size: 14px; fill: #111827; font-weight: 700; }
    .label { font-size: 11px; fill: #6b7280; }
    .num { font-size: 12px; fill: #ffffff; font-weight: 700; }
    .dot { fill: #374151; }
    .arrow { stroke: #374151; stroke-width: 1.5; fill: none; marker-end: url(#arrow); }
  </style>
  <defs>
    <marker id="arrow" markerWidth="7" markerHeight="7" refX="5" refY="3.5" orient="auto">
      <path d="M0,0 L7,3.5 L0,7 z" fill="#374151"/>
    </marker>
  </defs>
  <rect width="800" height="330" fill="#ffffff"/>
  <text x="30" y="26" class="heading">What happens when you run: kubectl apply -f pod.yaml</text>

  <rect x="20" y="60" width="150" height="90" class="you"/>
  <text x="32" y="84" class="mono" fill="#713f12">YOU</text>
  <text x="32" y="104" class="mono" fill="#713f12">kubectl apply</text>
  <text x="32" y="124" class="label">pod.yaml = desired state</text>

  <rect x="230" y="60" width="330" height="200" class="cp"/>
  <text x="242" y="82" class="mono" fill="#1e3a8a">CONTROL PLANE</text>
  <rect x="250" y="95" width="130" height="34" fill="#ffffff" stroke="#2563eb"/>
  <text x="260" y="116" class="mono" fill="#1e3a8a">kube-apiserver</text>
  <rect x="410" y="95" width="130" height="34" fill="#ffffff" stroke="#2563eb"/>
  <text x="420" y="116" class="mono" fill="#1e3a8a">etcd (saved)</text>
  <rect x="250" y="190" width="130" height="34" fill="#ffffff" stroke="#2563eb"/>
  <text x="260" y="211" class="mono" fill="#1e3a8a">kube-scheduler</text>
  <text x="250" y="245" class="label">picks a node for the new Pod</text>

  <rect x="620" y="60" width="160" height="200" class="node"/>
  <text x="632" y="82" class="mono" fill="#065f46">WORKER NODE</text>
  <rect x="635" y="95" width="130" height="34" fill="#ffffff" stroke="#059669"/>
  <text x="645" y="116" class="mono" fill="#065f46">kubelet</text>
  <rect x="635" y="150" width="130" height="60" fill="#ffffff" stroke="#059669"/>
  <text x="645" y="172" class="mono" fill="#065f46">Pod: hello</text>
  <text x="645" y="190" class="label">container running</text>

  <path d="M170 105 L248 105" class="arrow"/>
  <path d="M380 112 L408 112" class="arrow"/>
  <path d="M315 129 L315 188" class="arrow"/>
  <path d="M380 207 L618 207 L618 112 L633 112" class="arrow"/>
  <path d="M700 129 L700 148" class="arrow"/>

  <circle cx="209" cy="92" r="10" class="dot"/><text x="205" y="96" class="num">1</text>
  <circle cx="394" cy="99" r="10" class="dot"/><text x="390" y="103" class="num">2</text>
  <circle cx="331" cy="160" r="10" class="dot"/><text x="327" y="164" class="num">3</text>
  <circle cx="500" cy="195" r="10" class="dot"/><text x="496" y="199" class="num">4</text>
  <circle cx="714" cy="140" r="10" class="dot"/><text x="710" y="144" class="num">5</text>

  <text x="30" y="296" class="label">1 kubectl sends your YAML to the API server · 2 it is saved in etcd · 3 the scheduler picks a node ·</text>
  <text x="30" y="313" class="label">4 the kubelet on that node is told · 5 the kubelet starts the container and reports back</text>
</svg>
