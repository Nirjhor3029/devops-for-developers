<svg viewBox="0 0 800 300" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <style>
    .mono { font-family: 'Courier New', monospace; font-size: 12px; }
    .client { fill: #fefce8; stroke: #ca8a04; stroke-width: 1.5; }
    .svc { fill: #eff6ff; stroke: #2563eb; stroke-width: 1.5; }
    .pod { fill: #ecfdf5; stroke: #059669; stroke-width: 1.5; }
    .heading { font-size: 14px; fill: #111827; font-weight: 700; }
    .label { font-size: 11px; fill: #6b7280; }
    .arrow { stroke: #374151; stroke-width: 1.5; fill: none; marker-end: url(#arrow); }
  </style>
  <defs>
    <marker id="arrow" markerWidth="7" markerHeight="7" refX="5" refY="3.5" orient="auto">
      <path d="M0,0 L7,3.5 L0,7 z" fill="#374151"/>
    </marker>
  </defs>
  <rect width="800" height="300" fill="#ffffff"/>
  <text x="30" y="26" class="heading">One Service, many Pods (selector: app=web)</text>

  <rect x="20" y="105" width="150" height="80" class="client"/>
  <text x="32" y="130" class="mono" fill="#713f12">Client</text>
  <text x="32" y="150" class="label">another Pod, or you</text>
  <text x="32" y="166" class="label">calls http://web</text>

  <rect x="260" y="85" width="190" height="120" class="svc"/>
  <text x="272" y="110" class="mono" fill="#1e3a8a">Service: web</text>
  <text x="272" y="132" class="label">stable IP + DNS name</text>
  <text x="272" y="148" class="label">port: 80 → targetPort: 80</text>
  <text x="272" y="170" class="label">picks a healthy Pod</text>
  <text x="272" y="186" class="label">for every request</text>

  <rect x="560" y="45" width="200" height="50" class="pod"/>
  <text x="572" y="66" class="mono" fill="#065f46">Pod  app=web</text>
  <text x="572" y="83" class="label">IP 10.1.0.4</text>
  <rect x="560" y="125" width="200" height="50" class="pod"/>
  <text x="572" y="146" class="mono" fill="#065f46">Pod  app=web</text>
  <text x="572" y="163" class="label">IP 10.1.0.7</text>
  <rect x="560" y="205" width="200" height="50" class="pod"/>
  <text x="572" y="226" class="mono" fill="#065f46">Pod  app=web</text>
  <text x="572" y="243" class="label">IP 10.1.0.9</text>

  <path d="M170 145 L258 145" class="arrow"/>
  <path d="M450 120 L558 70" class="arrow"/>
  <path d="M450 145 L558 150" class="arrow"/>
  <path d="M450 170 L558 228" class="arrow"/>
  <text x="30" y="285" class="label">If a Pod dies, its IP changes — the Service keeps working because it follows the label, not the IP.</text>
</svg>
