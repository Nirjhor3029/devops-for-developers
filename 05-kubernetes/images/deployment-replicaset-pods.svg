<svg viewBox="0 0 800 300" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <style>
    .mono { font-family: 'Courier New', monospace; font-size: 12px; }
    .dep { fill: #eff6ff; stroke: #2563eb; stroke-width: 1.5; }
    .rs { fill: #ecfdf5; stroke: #059669; stroke-width: 1.5; }
    .old { fill: #f3f4f6; stroke: #9ca3af; stroke-width: 1.5; stroke-dasharray: 5 3; }
    .pod { fill: #ffffff; stroke: #059669; stroke-width: 1.5; }
    .heading { font-size: 14px; fill: #111827; font-weight: 700; }
    .label { font-size: 11px; fill: #6b7280; }
    .arrow { stroke: #374151; stroke-width: 1.5; fill: none; marker-end: url(#arrow); }
  </style>
  <defs>
    <marker id="arrow" markerWidth="7" markerHeight="7" refX="5" refY="3.5" orient="auto">
      <path d="M0,0 L7,3.5 L0,7 z" fill="#374151"/>
    </marker>
  </defs>
  <rect width="800" height="300" fill="#ffffff"/>
  <text x="30" y="26" class="heading">Deployment → ReplicaSet → Pods (replicas: 3)</text>

  <rect x="20" y="90" width="170" height="90" class="dep"/>
  <text x="32" y="114" class="mono" fill="#1e3a8a">Deployment: web</text>
  <text x="32" y="134" class="label">replicas: 3</text>
  <text x="32" y="150" class="label">image: nginx:1.28</text>
  <text x="32" y="166" class="label">updates + rollback</text>

  <rect x="260" y="50" width="200" height="90" class="rs"/>
  <text x="272" y="74" class="mono" fill="#065f46">ReplicaSet (new)</text>
  <text x="272" y="94" class="label">keeps 3 Pods alive</text>
  <text x="272" y="110" class="label">image: nginx:1.28</text>

  <rect x="260" y="190" width="200" height="70" class="old"/>
  <text x="272" y="214" class="mono" fill="#4b5563">ReplicaSet (old)</text>
  <text x="272" y="234" class="label">0 Pods, kept for rollback</text>
  <text x="272" y="250" class="label">image: nginx:1.27</text>

  <rect x="530" y="40" width="110" height="38" class="pod"/>
  <text x="542" y="63" class="mono" fill="#065f46">Pod web-a1</text>
  <rect x="530" y="90" width="110" height="38" class="pod"/>
  <text x="542" y="113" class="mono" fill="#065f46">Pod web-b2</text>
  <rect x="530" y="140" width="110" height="38" class="pod"/>
  <text x="542" y="163" class="mono" fill="#065f46">Pod web-c3</text>
  <text x="660" y="113" class="label">each runs nginx</text>

  <path d="M190 120 L258 95" class="arrow"/>
  <path d="M190 150 L258 215" class="arrow"/>
  <path d="M460 80 L528 60" class="arrow"/>
  <path d="M460 95 L528 109" class="arrow"/>
  <path d="M460 110 L528 159" class="arrow"/>
  <text x="260" y="285" class="label">kubectl rollout undo = scale the old ReplicaSet up, the new one down</text>
</svg>
