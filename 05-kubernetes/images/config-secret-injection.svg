<svg viewBox="0 0 800 300" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <style>
    .mono { font-family: 'Courier New', monospace; font-size: 12px; }
    .cm { fill: #eff6ff; stroke: #2563eb; stroke-width: 1.5; }
    .sec { fill: #fef2f2; stroke: #dc2626; stroke-width: 1.5; }
    .pod { fill: #ecfdf5; stroke: #059669; stroke-width: 1.5; }
    .heading { font-size: 14px; fill: #111827; font-weight: 700; }
    .label { font-size: 11px; fill: #6b7280; }
    .arrow { stroke: #374151; stroke-width: 1.5; fill: none; marker-end: url(#arrow); }
  </style>
  <defs>
    <marker id="arrow" markerWidth="7" markerHeight="7" refX="5" refY="3.5" orient="auto">
      <path d="M0,0 L7,3.5 L0,7 z" fill="#374151"/>
    </marker>
  </defs>
  <rect width="800" height="300" fill="#ffffff"/>
  <text x="30" y="26" class="heading">Same image, different settings</text>

  <rect x="20" y="60" width="230" height="90" class="cm"/>
  <text x="32" y="84" class="mono" fill="#1e3a8a">ConfigMap: app-config</text>
  <text x="32" y="106" class="label">APP_ENV = production</text>
  <text x="32" y="122" class="label">DB_HOST = mysql</text>
  <text x="32" y="138" class="label">normal, readable settings</text>

  <rect x="20" y="180" width="230" height="90" class="sec"/>
  <text x="32" y="204" class="mono" fill="#7f1d1d">Secret: db-secret</text>
  <text x="32" y="226" class="label">DB_PASSWORD = czNjcjN0...</text>
  <text x="32" y="242" class="label">base64 = NOT encrypted</text>
  <text x="32" y="258" class="label">guard with RBAC, never in Git</text>

  <rect x="400" y="80" width="250" height="160" class="pod"/>
  <text x="412" y="104" class="mono" fill="#065f46">Pod: web</text>
  <text x="412" y="130" class="label">container reads at start:</text>
  <text x="412" y="150" class="mono" fill="#065f46">APP_ENV=production</text>
  <text x="412" y="168" class="mono" fill="#065f46">DB_HOST=mysql</text>
  <text x="412" y="186" class="mono" fill="#065f46">DB_PASSWORD=****</text>
  <text x="412" y="216" class="label">or as files in /etc/app</text>

  <path d="M250 105 L398 130" class="arrow"/>
  <path d="M250 225 L398 190" class="arrow"/>
  <text x="290" y="285" class="label">Env vars update only after a restart; mounted files update by themselves.</text>
</svg>
