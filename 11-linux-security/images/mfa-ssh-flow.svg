<svg viewBox="0 0 800 400" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <style>
    .mono { font-family: 'Courier New', monospace; font-size: 11px; }
    .heading { font-size: 14px; fill: #111827; font-weight: 700; }
    .sub { font-size: 12px; fill: #374151; font-weight: 700; }
    .label { font-size: 11px; fill: #6b7280; }
    .step { fill: #eff6ff; stroke: #2563eb; stroke-width: 1.5; }
    .ok { fill: #f0fdf4; stroke: #16a34a; stroke-width: 1.5; }
    .bad { fill: #fef2f2; stroke: #dc2626; stroke-width: 1.5; }
    .note { fill: #fffbeb; stroke: #d97706; stroke-width: 1.2; }
    .arrow { stroke: #374151; stroke-width: 1.5; fill: none; marker-end: url(#arrow); }
    .arrowok { stroke: #16a34a; stroke-width: 1.5; fill: none; marker-end: url(#arrowg); }
    .arrowbad { stroke: #dc2626; stroke-width: 1.5; fill: none; marker-end: url(#arrowr); }
  </style>
  <defs>
    <marker id="arrow" markerWidth="7" markerHeight="7" refX="5" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7 z" fill="#374151"/></marker>
    <marker id="arrowg" markerWidth="7" markerHeight="7" refX="5" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7 z" fill="#16a34a"/></marker>
    <marker id="arrowr" markerWidth="7" markerHeight="7" refX="5" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7 z" fill="#dc2626"/></marker>
  </defs>
  <rect width="800" height="400" fill="#ffffff"/>
  <text x="30" y="26" class="heading">AuthenticationMethods publickey,keyboard-interactive</text>

  <!-- Human path -->
  <text x="30" y="54" class="sub">Match all (human accounts)</text>

  <rect x="20" y="66" width="140" height="44" class="step"/>
  <text x="32" y="92" class="mono" fill="#1e3a8a">Step 1: publickey</text>

  <path d="M162 88 L280 88" class="arrowok"/>
  <rect x="280" y="66" width="200" height="44" class="step"/>
  <text x="292" y="86" class="mono" fill="#1e3a8a">Step 2: keyboard-interactive</text>
  <text x="292" y="102" class="label">PAM asks only for a TOTP code</text>

  <path d="M482 88 L590 88" class="arrowok"/>
  <rect x="590" y="66" width="170" height="44" class="ok"/>
  <text x="602" y="92" class="mono" fill="#14532d">Session established ✓</text>

  <!-- Stolen key only -->
  <path d="M162 130 L280 130" class="arrowbad"/>
  <text x="170" y="122" class="label" fill="#991b1b">attacker has only the stolen key</text>
  <rect x="280" y="145" width="200" height="44" class="bad"/>
  <text x="292" y="165" class="mono" fill="#7f1d1d">no TOTP code →</text>
  <text x="292" y="181" class="label" fill="#991b1b">rejected at step 2 ✗</text>

  <!-- Divider -->
  <line x1="20" y1="215" x2="780" y2="215" stroke="#e5e7eb" stroke-width="1.5"/>
  <text x="30" y="240" class="sub">Match User deploy (CI/CD, non-interactive - can't type a code)</text>

  <rect x="20" y="252" width="140" height="44" class="step"/>
  <text x="32" y="278" class="mono" fill="#1e3a8a">Step 1: publickey</text>

  <path d="M162 274 L590 274" class="arrowok"/>
  <rect x="590" y="252" width="170" height="44" class="ok"/>
  <text x="602" y="278" class="mono" fill="#14532d">Session established ✓</text>
  <text x="170" y="266" class="label">AuthenticationMethods publickey only - no second step required for this one account</text>

  <rect x="20" y="320" width="740" height="56" class="note"/>
  <text x="34" y="340" class="label" fill="#78350f">Match blocks are evaluated in order - the first one matching an account wins for each setting. "Match all" at</text>
  <text x="34" y="358" class="label" fill="#78350f">the end restores two-factor for every account not explicitly exempted above it, like "Match User deploy".</text>
</svg>
