<svg viewBox="0 0 800 440" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <style>
    .mono { font-family: 'Courier New', monospace; font-size: 12px; }
    .heading { font-size: 14px; fill: #111827; font-weight: 700; }
    .sub { font-size: 12px; fill: #374151; font-weight: 700; }
    .label { font-size: 11px; fill: #6b7280; }
    .net { fill: #f3f4f6; stroke: #6b7280; stroke-width: 1.5; }
    .fw { fill: #eff6ff; stroke: #2563eb; stroke-width: 1.5; }
    .ok { fill: #f0fdf4; stroke: #16a34a; stroke-width: 1.5; }
    .bad { fill: #fef2f2; stroke: #dc2626; stroke-width: 1.5; }
    .warn { fill: #fffbeb; stroke: #d97706; stroke-width: 1.5; }
    .arrow { stroke: #374151; stroke-width: 1.5; fill: none; marker-end: url(#arrow); }
    .arrowok { stroke: #16a34a; stroke-width: 1.5; fill: none; marker-end: url(#arrowg); }
    .arrowbad { stroke: #dc2626; stroke-width: 1.5; fill: none; marker-end: url(#arrowr); }
    .arrowwarn { stroke: #d97706; stroke-width: 1.5; fill: none; marker-end: url(#arrowo); }
  </style>
  <defs>
    <marker id="arrow" markerWidth="7" markerHeight="7" refX="5" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7 z" fill="#374151"/></marker>
    <marker id="arrowg" markerWidth="7" markerHeight="7" refX="5" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7 z" fill="#16a34a"/></marker>
    <marker id="arrowr" markerWidth="7" markerHeight="7" refX="5" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7 z" fill="#dc2626"/></marker>
    <marker id="arrowo" markerWidth="7" markerHeight="7" refX="5" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7 z" fill="#d97706"/></marker>
  </defs>
  <rect width="800" height="440" fill="#ffffff"/>
  <text x="30" y="26" class="heading">Default-deny in practice — and where Docker quietly steps around it</text>

  <!-- Row 1: allowed -->
  <rect x="20" y="50" width="110" height="46" class="net"/>
  <text x="34" y="78" class="mono" fill="#374151">packet :443</text>
  <path d="M132 73 L300 73" class="arrowok"/>
  <rect x="300" y="50" width="200" height="46" class="fw"/>
  <text x="314" y="70" class="mono" fill="#1e3a8a">nftables (UFW)</text>
  <text x="314" y="86" class="label">rule: 443/tcp ALLOW</text>
  <path d="M502 73 L610 73" class="arrowok"/>
  <rect x="610" y="50" width="160" height="46" class="ok"/>
  <text x="624" y="78" class="mono" fill="#14532d">reaches Caddy ✓</text>

  <!-- Row 2: denied -->
  <rect x="20" y="120" width="110" height="46" class="net"/>
  <text x="34" y="148" class="mono" fill="#374151">packet :3306</text>
  <path d="M132 143 L300 143" class="arrowbad"/>
  <rect x="300" y="120" width="200" height="46" class="fw"/>
  <text x="314" y="140" class="mono" fill="#1e3a8a">nftables (UFW)</text>
  <text x="314" y="156" class="label">no rule → default DROP</text>
  <rect x="610" y="120" width="160" height="46" class="bad"/>
  <text x="624" y="148" class="mono" fill="#7f1d1d">never reaches MySQL ✗</text>

  <!-- Divider -->
  <line x1="20" y1="200" x2="780" y2="200" stroke="#e5e7eb" stroke-width="1.5"/>
  <text x="20" y="224" class="sub">The Docker gotcha: a second rule-writer in the same ruleset</text>

  <!-- Row 3: docker bypass -->
  <rect x="20" y="240" width="110" height="46" class="net"/>
  <text x="34" y="268" class="mono" fill="#374151">packet :5432</text>
  <path d="M132 263 L300 263" class="arrowwarn"/>
  <rect x="300" y="240" width="200" height="46" class="warn"/>
  <text x="314" y="260" class="mono" fill="#78350f">Docker's own ACCEPT</text>
  <text x="314" y="276" class="label">written straight into nftables</text>
  <path d="M502 263 L610 263" class="arrowwarn"/>
  <rect x="610" y="240" width="160" height="46" class="warn"/>
  <text x="624" y="262" class="mono" fill="#78350f">reaches postgres</text>
  <text x="624" y="277" class="label">even if "ufw status" shows nothing</text>

  <text x="20" y="320" class="label" fill="#78350f">docker run -p 5432:5432 postgres   →   Docker's rule is evaluated before UFW's default-deny ever applies to it.</text>
  <text x="20" y="342" class="label" fill="#166534">Fix: docker run -p 127.0.0.1:5432:5432 postgres   →   only reachable from the host itself, same as the Chapter 1 pattern for MySQL.</text>

  <text x="20" y="400" class="label">UFW and Docker both write rules into the one real nftables ruleset — "ufw status" only shows the rules UFW itself wrote.</text>
  <text x="20" y="418" class="label">Checking "nft list ruleset" is the only way to see the whole, real picture once Docker is on the same machine.</text>
</svg>
