<svg viewBox="0 0 800 380" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <style>
    .mono { font-family: 'Courier New', monospace; font-size: 11px; }
    .heading { font-size: 14px; fill: #111827; font-weight: 700; }
    .sub { font-size: 12px; fill: #374151; font-weight: 700; }
    .label { font-size: 11px; fill: #6b7280; }
    .commit { fill: #eff6ff; stroke: #2563eb; stroke-width: 1.5; }
    .bad { fill: #fef2f2; stroke: #dc2626; stroke-width: 1.5; }
    .ok { fill: #f0fdf4; stroke: #16a34a; stroke-width: 1.5; }
    .warn { fill: #fffbeb; stroke: #d97706; stroke-width: 1.2; }
    .arrow { stroke: #374151; stroke-width: 1.5; fill: none; marker-end: url(#arrow); }
  </style>
  <defs>
    <marker id="arrow" markerWidth="7" markerHeight="7" refX="5" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7 z" fill="#374151"/></marker>
  </defs>
  <rect width="800" height="380" fill="#ffffff"/>
  <text x="30" y="26" class="heading">A deleted secret is still in history - this is why rotation comes first</text>

  <rect x="30" y="50" width="200" height="60" class="bad"/>
  <text x="44" y="72" class="mono" fill="#7f1d1d">commit d0e84ae</text>
  <text x="44" y="90" class="label">password = "S3cr3t..."</text>
  <text x="44" y="104" class="label" fill="#991b1b">secret, in the clear</text>

  <path d="M232 80 L310 80" class="arrow"/>

  <rect x="310" y="50" width="200" height="60" class="ok"/>
  <text x="324" y="72" class="mono" fill="#14532d">commit 0de6e5f</text>
  <text x="324" y="90" class="label">password = env('DB_PASSWORD')</text>
  <text x="324" y="104" class="label" fill="#166534">looks clean now</text>

  <path d="M30 140 L230 140" class="arrow" stroke-dasharray="4,3"/>
  <text x="35" y="132" class="label" fill="#991b1b">git show d0e84ae:... still returns the original secret, unchanged, forever</text>

  <rect x="30" y="180" width="740" height="56" class="warn"/>
  <text x="44" y="200" class="label" fill="#78350f">Once commit 0de6e5f (or d0e84ae) is pushed, copies may already exist beyond this repository:</text>
  <text x="44" y="218" class="label" fill="#78350f">a teammate's clone, a CI runner's checkout/logs, a cached fork, a search-engine crawl of a public repo.</text>

  <text x="30" y="270" class="sub" fill="#991b1b">Step 1 (now): rotate the credential → the old value, wherever it exists, becomes worthless.</text>
  <text x="30" y="296" class="sub" fill="#1e3a8a">Step 2 (after): rewrite history (git filter-repo / BFG) → cleanup, not the fix.</text>

  <text x="30" y="340" class="label">History-rewriting the canonical repo cannot reach a copy that already left it before the rewrite happened.</text>
</svg>
