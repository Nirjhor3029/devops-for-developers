<svg viewBox="0 0 800 420" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <style>
    .mono { font-family: 'Courier New', monospace; font-size: 12px; }
    .heading { font-size: 14px; fill: #111827; font-weight: 700; }
    .sub { font-size: 12px; fill: #374151; font-weight: 700; }
    .label { font-size: 11px; fill: #6b7280; }
    .you { fill: #fefce8; stroke: #ca8a04; stroke-width: 1.5; }
    .web { fill: #eff6ff; stroke: #2563eb; stroke-width: 1.5; }
    .bad { fill: #fef2f2; stroke: #dc2626; stroke-width: 1.5; }
    .ok { fill: #f0fdf4; stroke: #16a34a; stroke-width: 1.5; }
    .arrow { stroke: #374151; stroke-width: 1.5; fill: none; marker-end: url(#arrow); }
    .arrowbad { stroke: #dc2626; stroke-width: 1.5; fill: none; marker-end: url(#arrowr); }
    .arrowok { stroke: #16a34a; stroke-width: 1.5; fill: none; marker-end: url(#arrowg); }
    .num { font-size: 11px; fill: #ffffff; font-weight: 700; }
    .dotbad { fill: #dc2626; }
    .dotok { fill: #16a34a; }
  </style>
  <defs>
    <marker id="arrow" markerWidth="7" markerHeight="7" refX="5" refY="3.5" orient="auto">
      <path d="M0,0 L7,3.5 L0,7 z" fill="#374151"/>
    </marker>
    <marker id="arrowr" markerWidth="7" markerHeight="7" refX="5" refY="3.5" orient="auto">
      <path d="M0,0 L7,3.5 L0,7 z" fill="#dc2626"/>
    </marker>
    <marker id="arrowg" markerWidth="7" markerHeight="7" refX="5" refY="3.5" orient="auto">
      <path d="M0,0 L7,3.5 L0,7 z" fill="#16a34a"/>
    </marker>
  </defs>
  <rect width="800" height="420" fill="#ffffff"/>
  <text x="30" y="26" class="heading">Password login vs key-based login: why there is nothing left to guess</text>

  <!-- Left lane: password (disabled) -->
  <text x="30" y="56" class="sub">Password authentication — disabled</text>

  <rect x="20" y="70" width="150" height="60" class="bad"/>
  <text x="32" y="95" class="mono" fill="#7f1d1d">Attacker bot</text>
  <text x="32" y="113" class="label">thousands of IPs</text>

  <rect x="610" y="70" width="170" height="60" class="web"/>
  <text x="624" y="95" class="mono" fill="#1e3a8a">Server</text>
  <text x="624" y="113" class="label">PasswordAuthentication no</text>

  <path d="M172 90 L608 90" class="arrowbad"/>
  <circle cx="390" cy="90" r="9" class="dotbad"/><text x="386" y="94" class="num">1</text>
  <text x="200" y="80" class="label">tries "admin" / "root123" / ...</text>

  <path d="M608 112 L172 112" class="arrowbad"/>
  <circle cx="390" cy="112" r="9" class="dotbad"/><text x="386" y="116" class="num">2</text>
  <text x="300" y="130" class="label" fill="#dc2626">rejected — no password path exists to check against</text>

  <!-- Right lane: key-based -->
  <text x="30" y="186" class="sub">Public-key authentication</text>

  <rect x="20" y="200" width="150" height="80" class="you"/>
  <text x="32" y="225" class="mono" fill="#713f12">Your laptop</text>
  <text x="32" y="243" class="label">holds the</text>
  <text x="32" y="258" class="label">private key</text>
  <text x="32" y="273" class="label" fill="#92400e">(never leaves)</text>

  <rect x="610" y="200" width="170" height="80" class="web"/>
  <text x="624" y="225" class="mono" fill="#1e3a8a">Server</text>
  <text x="624" y="243" class="label">already trusts your</text>
  <text x="624" y="258" class="label">public key in</text>
  <text x="624" y="273" class="label">authorized_keys</text>

  <path d="M172 230 L608 230" class="arrow"/>
  <circle cx="390" cy="230" r="9" class="dotok"/><text x="386" y="234" class="num">1</text>
  <text x="195" y="220" class="label">"I'm dev, here's my public key id"</text>

  <path d="M608 255 L172 255" class="arrow"/>
  <circle cx="390" cy="255" r="9" class="dotok"/><text x="386" y="259" class="num">2</text>
  <text x="230" y="275" class="label">server sends a random challenge</text>

  <path d="M172 300 L608 300" class="arrowok"/>
  <circle cx="390" cy="300" r="9" class="dotok"/><text x="386" y="304" class="num">3</text>
  <text x="200" y="293" class="label">signs the challenge with the private key</text>

  <rect x="320" y="330" width="160" height="40" class="ok"/>
  <text x="340" y="355" class="mono" fill="#14532d">Session established</text>
  <path d="M608 318 L480 345" class="arrowok"/>

  <text x="30" y="405" class="label">Nothing transmitted in the key flow (a username, a public key id, a signed challenge) is reusable to log in again — unlike a password.</text>
</svg>
